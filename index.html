<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e17">
<title>Darts Scorer</title>
<style>
  :root{
    --bg:#0a0e17;--panel:#151c2e;--panel2:#1c2438;--pad:#101728;
    --line:rgba(255,255,255,.08);--txt:#eef2ff;--muted:#8b96b4;
    --accent:#ff2d68;--accent2:#00e0c6;--gold:#ffd35c;--green:#2ee6a8;--red:#ff4d6d;
    --shadow:0 18px 40px -18px rgba(0,0,0,.9);--r:18px;--vh:100vh;--turn:#00e0c6;
  }
  @supports (height:100dvh){ :root{ --vh:100dvh; } }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{min-height:100%;overflow-x:hidden}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 15% -10%,#1d2743 0%,transparent 55%),
               radial-gradient(900px 700px at 110% 110%,#2a1230 0%,transparent 55%), var(--bg);
    background-attachment:fixed;color:var(--txt);
    -webkit-font-smoothing:antialiased;user-select:none;touch-action:manipulation;
  }
  #app{
    min-height:var(--vh);display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen{display:none;flex-direction:column}
  .screen.active{display:flex;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.5px;font-size:19px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  .brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:2.4px}
  .spacer{flex:1}
  .btn{
    border:1px solid var(--line);background:var(--panel);color:var(--txt);
    border-radius:14px;padding:14px 18px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .1s,background .15s;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;
  }
  .btn:active{transform:scale(.955)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#ff6a3d);border-color:transparent;box-shadow:0 10px 24px -12px var(--accent)}
  .btn.ghost{background:transparent}
  .btn.wide{width:100%}
  .btn.sm{padding:9px 14px;font-size:13px;min-height:40px;border-radius:11px}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .icon-btn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:18px}
  h2.title{font-size:26px;font-weight:800;letter-spacing:-.4px}
  .sub{color:var(--muted);font-size:13px;font-weight:600;margin-top:4px}
  #scr-home, #scr-players{position:relative}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 18px}
  .hero{padding:8px 18px 14px;flex-shrink:0}
  .hero h1{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1}
  .hero h1 span{background:linear-gradient(120deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);font-size:14px;margin-top:8px;font-weight:600}
  .grid{display:grid;gap:14px}
  @media (min-width:700px){ .grid{grid-template-columns:1fr 1fr} }
  @media (min-width:1100px){ .grid{grid-template-columns:1fr 1fr 1fr} }
  .mode-card{
    position:relative;overflow:hidden;border-radius:var(--r);padding:20px;
    background:linear-gradient(150deg,var(--panel2),var(--panel));
    border:1px solid var(--line);cursor:pointer;transition:transform .12s,border-color .2s;
    box-shadow:var(--shadow);text-align:left;
  }
  .mode-card:active{transform:scale(.98)}
  .mode-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 18px 44px -20px var(--accent)}
  .mode-card .ico{font-size:30px;margin-bottom:10px;display:block}
  .mode-card h3{font-size:19px;font-weight:800}
  .mode-card p{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:5px;line-height:1.45}
  .mode-card .tag{position:absolute;top:16px;right:16px;font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--accent2);border:1px solid rgba(0,224,198,.35);padding:4px 9px;border-radius:20px}
  .plist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  @media (min-width:900px){ .plist{display:grid;grid-template-columns:1fr 1fr;gap:12px} }
  .prow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:10px 12px}
  .avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:17px;color:#08101c;flex-shrink:0}
  .pname-input{flex:1;background:transparent;border:none;color:var(--txt);font-size:17px;font-weight:700;font-family:inherit;outline:none;min-width:0;padding:6px 2px}
  .pname-input::placeholder{color:#5a6580}
  .del{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:17px;cursor:pointer}
  .del:active{color:var(--red);border-color:var(--red)}
  .ctag{font-size:10px;font-weight:900;letter-spacing:1.2px;padding:4px 8px;border-radius:8px;border:1px solid currentColor;white-space:nowrap}
  .setup-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
  .setup-box h4{font-size:12px;letter-spacing:1.8px;color:var(--muted);font-weight:800;margin-bottom:12px}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:10px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
  .chip.on{background:linear-gradient(135deg,var(--accent),#ff6a3d);color:#fff;border-color:transparent}
  .warn{background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.35);color:#ffb3c1;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:700;margin-top:12px}
  .footer-bar{
    position:sticky;bottom:0;z-index:20;flex-shrink:0;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:linear-gradient(180deg,rgba(10,14,23,.82),rgba(10,14,23,.98));
    backdrop-filter:blur(12px);
  }
  .lvl-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  @media (min-width:760px){ .lvl-grid{grid-template-columns:repeat(4,1fr)} }
  .lvl-card{border-radius:14px;padding:11px 12px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;text-align:left;transition:transform .1s,border-color .2s}
  .lvl-card:active{transform:scale(.97)}
  .lvl-card.on{border-color:var(--accent2);background:linear-gradient(150deg,rgba(0,224,198,.14),var(--panel2));box-shadow:0 0 0 1px var(--accent2)}
  .lvl-card .lv-top{display:flex;align-items:center;gap:7px}
  .lvl-card .lv-num{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:900;background:var(--panel);color:var(--muted);flex-shrink:0}
  .lvl-card.on .lv-num{background:var(--accent2);color:#062018}
  .lvl-card .lv-name{font-size:14.5px;font-weight:900}
  .lvl-card .lv-meta{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:5px;line-height:1.5}
  .lvl-card .lv-meta b{color:var(--txt);font-variant-numeric:tabular-nums}
  #scr-game{flex:1;min-height:0}
  .game-top{display:flex;align-items:center;gap:8px;padding:8px 14px 4px;flex-shrink:0}
  .game-top .meta{min-width:0}
  .game-top .meta h2{font-size:17px;font-weight:900;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .game-top .meta .sub{font-size:11px;margin-top:0}
  .view-toggle{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px}
  .view-toggle button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:800;font-size:10.5px;letter-spacing:.5px;padding:8px 10px;border-radius:8px;cursor:pointer}
  .view-toggle button.on{background:var(--accent2);color:#062018}
  .board{display:grid;gap:8px;padding:6px 14px 2px;flex-shrink:0;grid-auto-flow:column;grid-auto-columns:minmax(132px,1fr);overflow-x:auto;scrollbar-width:none}
  .board::-webkit-scrollbar{display:none}
  .pcard{min-width:132px;border-radius:14px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;transition:border-color .2s,background .2s}
  .pcard.turn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--turn)}
  .pcard .toprow{display:flex;align-items:center;gap:6px}
  .pcard .nm{flex:1;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .legs{font-size:11px;font-weight:900;font-variant-numeric:tabular-nums;border-radius:7px;padding:2px 7px;background:rgba(255,255,255,.06)}
  .pcard .sc-label{font-size:9px;font-weight:900;letter-spacing:1.4px;color:var(--muted);margin-top:3px}
  .pcard .sc{font-size:clamp(26px,3.2vw,38px);font-weight:900;letter-spacing:-1.5px;margin-top:-1px;font-variant-numeric:tabular-nums;line-height:1.02}
  .pcard .darts{display:flex;gap:4px;margin-top:5px}
  .pcard .darts i{width:100%;height:4px;border-radius:3px;background:rgba(255,255,255,.12)}
  .pcard .darts i.on{background:var(--accent2)}
  .pcard.turn .darts i.on{background:var(--turn)}
  .play-area{flex:1;min-height:0;display:flex;gap:10px;padding:4px 14px 10px}
  .side{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:7px}
  .keypad-col{width:min(48%,440px);min-height:0;display:flex;flex-direction:column;min-width:0}
  .turn-banner{border-radius:14px;padding:9px 15px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-shrink:0;transition:border-color .25s,box-shadow .25s}
  .turn-banner.active{border-color:var(--turn);box-shadow:0 0 0 1px var(--turn),0 14px 40px -26px var(--turn)}
  .turn-banner .who{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .turn-banner .hint{color:var(--muted);font-size:12px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .turn-banner .hint.bust{color:var(--red)}
  .turn-banner .left-count{margin-left:auto;text-align:right;flex-shrink:0}
  .turn-banner .left-count b{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}
  .turn-banner .left-count b.bust{color:var(--red);font-size:16px}
  .turn-banner .left-count span{display:block;font-size:9.5px;letter-spacing:1.5px;color:var(--muted);font-weight:800}
  .slot-row{display:flex;gap:7px;flex-shrink:0}
  .slot{flex:1;border-radius:13px;border:1.5px dashed var(--line);background:rgba(255,255,255,.02);height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .slot.filled{border-style:solid;border-color:var(--accent2);background:rgba(0,224,198,.09)}
  .slot .big{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
  .slot .lbl{font-size:9px;font-weight:800;letter-spacing:1.1px;color:var(--muted)}
  .slot.filled .lbl{color:var(--accent2)}
  .panel-area{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px}
  .finish-card{display:flex;align-items:center;gap:12px;border-radius:14px;padding:7px 13px;border:1px solid rgba(0,224,198,.32);background:linear-gradient(120deg,rgba(0,224,198,.10),rgba(255,255,255,.02));flex-shrink:0}
  .finish-card.bogey{border-color:rgba(255,211,92,.35);background:linear-gradient(120deg,rgba(255,211,92,.10),rgba(255,255,255,.02))}
  .finish-card.bust{border-color:rgba(255,77,109,.5);background:linear-gradient(120deg,rgba(255,77,109,.16),rgba(255,255,255,.02))}
  .finish-card .fnum{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px;min-width:54px;line-height:1}
  .finish-card.bust .fnum{color:var(--red);font-size:16px;letter-spacing:0}
  .flabel{font-size:9px;letter-spacing:1.6px;font-weight:800;color:var(--muted)}
  .froute{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:3px}
  .fchip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:900;font-variant-numeric:tabular-nums}
  .farrow{color:var(--muted);font-size:11px;font-weight:800}
  .froute .note{font-size:12px;font-weight:800;color:var(--gold)}
  .hist{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:4px 10px;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .hist .hh{font-size:10px;letter-spacing:1.8px;color:var(--muted);font-weight:800;padding:7px 6px 5px;position:sticky;top:0;background:var(--panel);z-index:1}
  .hrow{display:flex;align-items:center;gap:10px;padding:6px 6px;border-top:1px solid rgba(255,255,255,.05);font-size:12.5px}
  .hrow .hn{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hrow .hd{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .hrow .hv{font-weight:900;width:48px;text-align:right;font-variant-numeric:tabular-nums}
  .hrow .hv.bust{color:var(--red)}
  .pad{background:var(--pad);border:1px solid var(--line);border-radius:15px;padding:9px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;transition:border-color .25s,box-shadow .25s}
  .pad.turn-glow{border-color:var(--turn);box-shadow:0 0 0 1px var(--turn),0 16px 46px -26px var(--turn)}
  .pad-display{display:flex;align-items:center;gap:10px;background:#0b1020;border-radius:11px;padding:6px 12px;flex-shrink:0}
  .pad-display .armed{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#062018;background:linear-gradient(135deg,var(--accent2),#29ff8f);transition:background .15s}
  .pad-display .armed.m2{background:linear-gradient(135deg,var(--gold),#ffb03a)}
  .pad-display .armed.m3{background:linear-gradient(135deg,var(--accent),#ff6a3d);color:#fff}
  .pad-display .armed-lbl{font-size:9.5px;font-weight:800;letter-spacing:1.3px;color:var(--muted);line-height:1.35}
  .pad-display .armed-lbl b{display:block;color:var(--txt);font-size:13px;letter-spacing:.4px}
  .pad-display .last{margin-left:auto;text-align:right;font-size:9px;font-weight:800;letter-spacing:1.2px;color:var(--muted);line-height:1.35}
  .pad-display .last b{display:block;color:var(--accent2);font-size:15px;letter-spacing:0;font-variant-numeric:tabular-nums}
  .mult-row{display:flex;gap:6px;flex-shrink:0}
  .mult{flex:1;border-radius:10px;padding:8px 0;font-weight:900;font-size:13.5px;cursor:pointer;background:var(--panel2);border:1px solid var(--line);color:var(--muted);text-align:center;transition:transform .08s}
  .mult:active{transform:scale(.95)}
  .mult.on{background:linear-gradient(135deg,var(--accent2),#29ff8f);color:#062018;border-color:transparent}
  .mult.on[data-mult="2"]{background:linear-gradient(135deg,var(--gold),#ffb03a)}
  .mult.on[data-mult="3"]{background:linear-gradient(135deg,var(--accent),#ff6a3d);color:#fff}
  .mult small{display:block;font-size:8px;letter-spacing:1px;font-weight:800;opacity:.7;margin-top:1px}
  .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:1;min-height:0;grid-auto-rows:1fr}
  .key{border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:clamp(14px,1.8vw,19px);font-weight:800;cursor:pointer;font-family:inherit;display:grid;place-items:center;min-height:0;transition:transform .07s,background .15s,opacity .15s;font-variant-numeric:tabular-nums}
  .key:active{transform:scale(.93);background:#2b3654}
  .key.locked{opacity:.28;pointer-events:none}
  .key.bull{background:rgba(255,45,104,.16);border-color:rgba(255,45,104,.45);color:#ff9ab4;font-size:clamp(10px,1.3vw,13px)}
  .key.zero{background:rgba(255,255,255,.03);color:var(--muted);font-size:clamp(10px,1.3vw,13px)}
  .key.back{grid-column:span 2;background:rgba(255,77,109,.14);border-color:rgba(255,77,109,.4);color:#ffb3c1;font-size:clamp(10px,1.2vw,12.5px);letter-spacing:.4px}
  .enter-sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(21,28,46,.96),rgba(12,17,30,.99));border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -20px 50px -16px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.03);transform:translateY(115%);transition:transform .28s cubic-bezier(.2,1.2,.5,1);backdrop-filter:blur(14px)}
  .enter-sheet.show{transform:translateY(0)}
  .enter-sheet.bust{background:linear-gradient(180deg,rgba(60,18,34,.97),rgba(28,10,20,.99));border-top-color:rgba(255,77,109,.5)}
  .enter-sheet.win{background:linear-gradient(180deg,rgba(18,58,44,.97),rgba(8,28,22,.99));border-top-color:rgba(46,230,168,.55)}
  .enter-sheet .es-top{display:flex;align-items:center;gap:12px}
  .enter-sheet .es-darts{display:flex;gap:7px;flex:1;min-width:0}
  .es-chip{flex:1;min-width:0;border-radius:13px;padding:9px 6px;text-align:center;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .es-chip .b{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
  .es-chip .l{font-size:9px;font-weight:800;letter-spacing:1.1px;color:var(--muted);margin-top:2px}
  .enter-sheet .es-sum{margin-left:auto;text-align:right;flex-shrink:0;padding-left:8px}
  .enter-sheet .es-sum .n{font-size:30px;font-weight:900;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1}
  .enter-sheet .es-sum .l{font-size:9px;font-weight:800;letter-spacing:1.5px;color:var(--muted)}
  .enter-sheet.bust .es-sum .n{color:var(--red)}
  .enter-sheet .es-verdict{font-size:12.5px;font-weight:800;color:var(--muted);margin-top:9px;text-align:center}
  .enter-sheet .es-verdict.bust{color:var(--red)}
  .enter-sheet .es-verdict.win{color:var(--green)}
  .enter-sheet .es-row3{display:flex;gap:8px;margin-top:11px}
  .enter-sheet .es-row3 .btn{flex:1;min-height:56px;font-size:14px}
  .enter-sheet .es-go{flex:2;background:linear-gradient(135deg,var(--green),#19c98d);border:none;color:#052018;box-shadow:0 10px 28px -10px var(--green);font-size:18px;letter-spacing:.5px}
  .enter-sheet.bust .es-go{background:linear-gradient(135deg,var(--red),#c9203f);color:#fff;box-shadow:0 10px 28px -10px var(--red)}
  .points-flash{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%) scale(.82);z-index:67;pointer-events:none;opacity:0;transition:opacity .22s,transform .22s cubic-bezier(.2,1.4,.5,1);text-align:center;padding:10px 30px}
  .points-flash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .points-flash .pf-who{font-size:clamp(14px,2.6vw,20px);font-weight:900;letter-spacing:2px;opacity:.9}
  .points-flash .pf-pts{font-size:clamp(64px,17vw,180px);font-weight:900;letter-spacing:-6px;line-height:.9;margin-top:2px;text-shadow:0 0 40px currentColor}
  .turn-flash{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%) scale(.92);z-index:65;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;padding:16px 28px;border-radius:20px;text-align:center;background:linear-gradient(160deg,rgba(21,28,46,.97),rgba(10,15,26,.98));border:2px solid var(--tf,#fff);box-shadow:0 0 0 1px var(--tf,#fff),0 26px 70px -22px var(--tf,#fff);min-width:min(80vw,500px)}

<script>
/* =========================================================
   SEAT COLOURS
   ========================================================= */
const SEAT = [
  {color:'#ff3b3b', name:'RED'},{color:'#2ee6a8', name:'GREEN'},
  {color:'#4da3ff', name:'BLUE'},{color:'#ffd35c', name:'GOLD'},
  {color:'#a78bfa', name:'PURPLE'},{color:'#ff8a3d', name:'ORANGE'},
  {color:'#ff5ec4', name:'PINK'},{color:'#00e0c6', name:'CYAN'}
];
function seat(i){ return SEAT[i % SEAT.length]; }
function hexA(hex,a){
  const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* =========================================================
   MODES
   ========================================================= */
const MODES = [
  { id:'x01', name:'301 / 501 / 701', ico:'🎯', tag:'CLASSIC',
    unit:'legs', defaultMatch:1,
    desc:'Count down to exactly zero. Finish on a double to win.',
    variants:[{id:'301',label:'301'},{id:'501',label:'501'},{id:'701',label:'701'}],
    def:'501', minPlayers:2, maxPlayers:8, targetRounds:0,
    rules:'Start from 301/501/701. Each visit is up to 3 darts. Reach exactly 0 on a double (or bullseye) to win the leg. Going below 2, or hitting 0 without a double, is a BUST.' },
  { id:'cricket', name:'Cricket', ico:'🦗', tag:'TACTIC', unit:'games', defaultMatch:1,
    desc:'Close 20→15 and bull, then pile on the points.',
    variants:[{id:'cricket',label:'Standard'},{id:'cricket_noscore',label:'No Score'}],
    def:'cricket', minPlayers:2, maxPlayers:8, targetRounds:0,
    rules:'Mark 20, 19, 18, 17, 16, 15 and the bullseye. Three marks closes a number. Once closed, further hits score its value if an opponent is still open. The board shows your marks on the outer ring and glows gold on your scoring zones.'},
  { id:'rtc', name:'Round the Clock', ico:'🕐', tag:'TRAINING', unit:'games', defaultMatch:1,
    desc:'Hit 1 through 20 in order, finishing on bull.',
    variants:[{id:'rtc',label:'Any segment'},{id:'rtc_double',label:'Doubles only'}],
    def:'rtc', minPlayers:1, maxPlayers:8, targetRounds:0,
    rules:'Hit numbers in ascending order: 1 → 20, then the bullseye. Completed numbers black out and the next target glows red neon on the board. First to hit the bull wins.'},
  { id:'target', name:'Target Practice', ico:'🎲', tag:'CHALLENGE', unit:'none', defaultMatch:1,
    desc:'Shared targets, race to clear. Single 1 pt · Double 2 · Checkout 3.',
    variants:[
      {id:'target_num',label:'Random number'},
      {id:'target_double',label:'Random double'},
      {id:'target_checkout',label:'Random checkout'},
      {id:'target_mix',label:'Mixed bag'}
    ],
    def:'target_mix', minPlayers:1, maxPlayers:8, targetRounds:10,
    rules:'Ten targets, shared. A random player throws first each target, and whoever CLEARS it first takes the points: single = 1, double = 2, checkout = 3. Checkouts (11–60) must finish on a double, with three fresh darts. Highest total after 10 targets wins.'},
  { id:'quack', name:'Shanghai', ico:'⚡', tag:'CLUTCH', unit:'games', defaultMatch:1,
    desc:'1→20, but a single+double+treble of the number wins instantly.',
    variants:[{id:'quack',label:'Shanghai'},{id:'kill',label:'Killer'},{id:'baseball',label:'Baseball'}],
    def:'quack', minPlayers:2, maxPlayers:8, targetRounds:0,
    rules:'Shanghai: work 1→20 in order. Hit single, double AND treble of the same number in one visit and you win instantly — otherwise the highest total after 20 wins. Killer: hit your double to become a killer, then hit opponents’ doubles to strip lives. Baseball: 9 innings.'},
  { id:'free', name:'Free Practice', ico:'🧘', tag:'SANDBOX', unit:'none', defaultMatch:1,
    desc:'No rules, no pressure — just track your darts and averages.',
    variants:[{id:'free',label:'Unlimited throws'}],
    def:'free', minPlayers:1, maxPlayers:8, targetRounds:0,
    rules:'A calm practice board. Every dart is recorded and visit averages shown. No winning, no losing.'}
];

const LEVELS = [
  { id:1, name:'Beginner',    darts:'30–45 darts', avg:'34–50 avg',
    acc:.30, t20:.18, scatterSpread:14, co:.15, coHit:.20, scoreSeg:1 },
  { id:2, name:'Amateur',     darts:'24–30 darts', avg:'50–63 avg',
    acc:.44, t20:.35, scatterSpread:11, co:.40, coHit:.32, scoreSeg:2 },
  { id:3, name:'Club Player', darts:'18–24 darts', avg:'63–83 avg',
    acc:.58, t20:.62, scatterSpread:8,  co:.72, coHit:.44, scoreSeg:3 },
  { id:4, name:'Pro',         darts:'15–18 darts', avg:'83–100 avg',
    acc:.72, t20:.85, scatterSpread:6,  co:.95, coHit:.58, scoreSeg:3 }
];
const levelById = id => LEVELS.find(l=>l.id===id) || LEVELS[2];

const MATCH_OPTIONS = [1,3,5];

let state = {
  mode: MODES[0], variant:'501', players:[],
  opponent:'human', cpuCount:1, cpuLevel:2,
  matchTarget:1,
  view:'fit',
  g:null, m:null
};

/* =========================================================
   CHECKOUT SOLVER
   ========================================================= */
const DART_OPTS = (()=>{
  const a=[];
  for(let n=1;n<=20;n++){
    a.push({v:n,mult:3,label:'T'+n});
    a.push({v:n,mult:1,label:'S'+n});
    a.push({v:n,mult:2,label:'D'+n});
  }
  a.push({v:50,mult:1,label:'BULL'});
  return a;
})();
const DOUBLES = DART_OPTS.filter(d=>d.mult===2||d.v===50);
const FIN_RANK = {20:0,16:1,18:2,12:3,10:4,8:5,4:6,2:7,1:8,14:9,15:10,13:11,11:12,9:13,7:14,5:15,6:16,3:17};
const finRank = d => (d.v===50 ? 6 : (FIN_RANK[d.v]!==undefined ? FIN_RANK[d.v] : 20));
function cmpRoute(x,y){
  const rx=finRank(x[x.length-1]), ry=finRank(y[y.length-1]);
  if(rx!==ry) return rx-ry;
  for(let i=0;i<x.length-1;i++){
    const xv=DART_OPTS.indexOf(x[i]), yv=DART_OPTS.indexOf(y[i]);
    if(xv!==yv) return yv-xv;
  }
  return 0;
}
const routeCache = new Map();
function routeFor(score){
  if(score<2 || score>170) return null;
  if(routeCache.has(score)) return routeCache.get(score);
  for(const d of DOUBLES){ if(d.v*d.mult===score){ routeCache.set(score,[d]); return [d]; } }
  let best=null;
  for(const a of DART_OPTS){ const av=a.v*a.mult;
    for(const d of DOUBLES){ if(av + d.v*d.mult === score){ const r=[a,d]; if(!best||cmpRoute(r,best)<0) best=r; } }
  }
  if(best){ routeCache.set(score,best); return best; }
  for(const a of DART_OPTS){ const av=a.v*a.mult;
    for(const b of DART_OPTS){ const bv=av + b.v*b.mult; if(bv>=score) continue;
      for(const d of DOUBLES){ if(bv + d.v*d.mult === score){ const r=[a,b,d]; if(!best||cmpRoute(r,best)<0) best=r; } }
    }
  }
  routeCache.set(score,best||null);
  return best||null;
}
function routeLeft(rem, dartsLeft){
  const r = routeFor(rem);
  return (r && r.length <= dartsLeft) ? r : null;
}
function setupDart(rem){
  const wants = [60,57,54,51,50,45,40,36,32,34,38,28,24,20,16];
  const target = rem-32;
  let best=wants[0], bd=Infinity;
  wants.forEach(w=>{ const d=Math.abs(w-target); if(d<bd){bd=d;best=w;} });
  return {v:Math.max(1,Math.min(20,Math.round(best/3))), mult:3};
}

/* =========================================================
   UTILITIES
   ========================================================= */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function syncVh(){
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--vh', h + 'px');
}
syncVh();
window.addEventListener('resize', syncVh);
window.addEventListener('orientationchange', ()=>setTimeout(syncVh,120));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', syncVh);
  window.visualViewport.addEventListener('scroll', syncVh);
}
function show(id){
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  if(id !== 'scr-game'){ hideEnterSheet(); $('#turnFlash').classList.remove('show'); $('#pointsFlash').classList.remove('show'); }
  if(state.view !== 'fit') window.scrollTo({top:0,behavior:'instant'});
}
function setView(v){
  state.view = v;
  document.body.classList.toggle('view-fit', v==='fit');
  document.body.classList.toggle('view-scroll', v==='scroll');
  $$('#viewRow .chip').forEach(c => c.classList.toggle('on', c.dataset.view===v));
  $$('#viewToggle button').forEach(b => b.classList.toggle('on', b.dataset.v===v));
  syncVh();
}
function vibrate(ms){ if(navigator.vibrate) try{navigator.vibrate(ms)}catch(e){} }
function toggleFullscreen(){
  const el = document.documentElement;
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if(!isFs){ const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req){ try{ const r=req.call(el); if(r&&r.catch) r.catch(()=>{}); }catch(e){} } }
  else { const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(exit){ try{ exit.call(document); }catch(e){} } }
  setTimeout(syncVh, 350);
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function turnColor(c){ document.documentElement.style.setProperty('--turn', c || '#00e0c6'); }
let flashTimer=null, ptsTimer=null;
function flashTurn(p, top, sub){
  const el = $('#turnFlash'); if(!el) return;
  const col = p ? p.color : '#fff';
  el.style.setProperty('--tf', col);
  el.innerHTML = `<div class="tf-top">${escapeHtml(top)}</div>
    <div class="tf-name" style="color:${col}">${escapeHtml(p?p.name:'')}</div>
    <div class="tf-sub" style="color:${col}">${escapeHtml(sub)}</div>`;
  el.classList.add('show');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>el.classList.remove('show'), 1150);
}
/* big points flash. the ONLY place points are shown at the moment of winning.
   onDone fires when it clears, so the next round can be revealed afterwards. */
function flashPoints(p, pts, onDone){
  const el = $('#pointsFlash'); if(!el) return;
  const col = p ? p.color : '#fff';

/* =========================================================
   TARGET SPECS
   ========================================================= */
function variantKind(v){
  if(v==='target_num') return 'num';
  if(v==='target_double') return 'double';
  if(v==='target_checkout') return 'checkout';
  const r = Math.random();
  return r<.35 ? 'num' : (r<.65 ? 'double' : 'checkout');
}
const CHECKOUT_POOL = (()=>{
  const pool=[];
  for(let n=11;n<=60;n++){
    if(n===50) continue;
    if(n%2===0 && n<=40) continue;
    const r = routeFor(n);
    if(!r || r.length < 2) continue;
    pool.push(n);
  }
  return pool;
})();
function drawTargetSpec(){
  const kind = variantKind(state.variant);
  if(kind==='num'){
    const n = 1 + Math.floor(Math.random()*20);
    return {kind:'num', num:n, text:'S'+n, pay:1};
  }
  if(kind==='double'){
    const n = 1 + Math.floor(Math.random()*20);
    return {kind:'double', num:n, text:'D'+n, pay:2};
  }
  const sc = CHECKOUT_POOL[Math.floor(Math.random()*CHECKOUT_POOL.length)];
  return {kind:'checkout', num:sc, text:String(sc), route: routeFor(sc), pay:3};
}

/* =========================================================
   MATCH + GAME SETUP
   ========================================================= */
function startMatch(){
  const players = state.players.map((p,i)=>({
    id:i, name:(p.name.trim()||('Player '+(i+1))), color:p.color, colourName:p.colourName, cpu:p.cpu
  }));
  const unit = state.mode.unit;
  state.m = {
    players, modeId: state.mode.id, unit,
    target: (unit==='none') ? 1 : state.matchTarget,
    targetRounds: state.mode.targetRounds || 10,
    wins: {}, played: 0, over:false
  };
  players.forEach(p => state.m.wins[p.id] = 0);
  startGame();
}
function startGame(){
  const m = state.m;
  const players = (m ? m.players : state.players).map(p=>({...p}));
  const g = {
    mode: state.mode.id, variant: state.variant, players, turn: 0,
    dartsThrown:{}, history:[], aiPending:false, over:false, _visit:{}, _locked:false, _tapAt:0,
    level: state.cpuLevel, flashFirst:false, _awarded:false, hushTurn:false
  };
  players.forEach(p => g.dartsThrown[p.id] = 0);

  if(g.mode==='x01'){ g.startValue = +g.variant.replace('x','') || 501; players.forEach(p=>{ p.score = g.startValue; }); }
  if(g.mode==='cricket') players.forEach(p=>{ p.marks = {20:0,19:0,18:0,17:0,16:0,15:0,25:0}; p.score = 0; });
  if(g.mode==='rtc') players.forEach(p=>{ p.target = 1; p.hits = 0; });
  if(g.mode==='target'){
    g.targetRounds = m ? m.targetRounds : 10;
    g.round = 1;
    players.forEach(p=>{ p.score = 0; p.hits = 0; p.cleared = false; p.gaveUp = false; p.tRemain = null; p.tBust = false; });
    setupRound(g);
  }
  if(g.mode==='quack'){
    if(g.variant==='quack') players.forEach(p=>{ p.target = 1; p.score = 0; });
    if(g.variant==='kill') players.forEach(p=>{ p.lives = 3; p.killer = false; p.targetAssigned = false; });
    if(g.variant==='baseball') players.forEach(p=>{ p.score = 0; p.inning = 1; p.runs = 0; });
  }
  if(g.mode==='free') players.forEach(p=>{ p.score = 0; });

  lastDart = null; padMult = 1;
  state.g = g;
  hideEnterSheet(); hidePoints();
  show('scr-game');
  setView(state.view);
  buildKeypad();
  renderGame();
  vibrate(20);
  beginTurn();
}
function setupRound(g){
  g.spec = drawTargetSpec();
  g.firstId = g.players[Math.floor(Math.random()*g.players.length)].id;
  g.turn = g.firstId;
  g.flashFirst = true;
  g.players.forEach(p=>{ p.spec = g.spec; p.cleared = false; p.gaveUp = false; p.tRemain = null; p.tBust = false; });
}

/* =========================================================
   KEYPAD
   ========================================================= */
let padMult = 1;
let lastDart = null;
function buildKeypad(){
  let html = '';
  for(let n=1;n<=20;n++) html += `<button class="key num" data-num="${n}">${n}</button>`;
  html += `<button class="key bull" data-num="25">25</button>`;
  html += `<button class="key bull" data-num="50">BULL</button>`;
  html += `<button class="key zero" data-num="0">MISS</button>`;
  html += `<button class="key back" data-back>⌫ DELETE</button>`;
  $('#keys').innerHTML = html;

  $$('#keys .key[data-num]').forEach(k => k.addEventListener('click', ()=>{ enterDart(+k.dataset.num, padMult); }));
  $$('#multRow .mult').forEach(m => m.addEventListener('click', ()=>{ padMult = +m.dataset.mult; renderPad(); vibrate(6); }));
  const back = $('#keys [data-back]');
  if(back) back.addEventListener('click', ()=>{
    const g = state.g; if(!g || g._locked) return;
    const cur = g.players[g.turn];
    if((g._visit[cur.id]||[]).length){
      g._visit[cur.id].pop();
      g.dartsThrown[cur.id] = Math.max(0,(g.dartsThrown[cur.id]||1)-1);
      lastDart = (g._visit[cur.id]||[]).slice(-1)[0] || null;
      padMult = 1; rebuildAll(); renderGame();
    }
    vibrate(10);
  });
}
function renderPad(){
  const g = state.g;
  const p = g ? g.players[g.turn] : null;
  const darts = (g && p) ? (g._visit[p.id]||[]) : [];
  const full = darts.length >= 3;
  const el = $('#padArmed');
  el.textContent = padMult===1?'S':padMult===2?'D':'T';
  el.className = 'armed m'+padMult;
  $('#padMultLbl').textContent = padMult===1?'SINGLE':padMult===2?'DOUBLE':'TREBLE';
  if(lastDart){
    const sc = dartScore(lastDart.v,lastDart.mult);
    $('#padLast').textContent = (lastDart.v===0?'MISS':dartLabel(lastDart.v,lastDart.mult)) + ' · ' + sc;
  } else { $('#padLast').textContent = '—'; }
  $$('#multRow .mult').forEach(m => m.classList.toggle('on', +m.dataset.mult===padMult));
  const blocked = !g || g.over || (p && p.cpu) || g.aiPending || g._locked;
  const lockNums = blocked || full;
  $$('#keys .key.num, #keys .key.bull, #keys .key.zero').forEach(k => k.classList.toggle('locked', lockNums));
  const back = $('#keys [data-back]');
  if(back) back.classList.toggle('locked', blocked || darts.length===0);
}
function dartScore(v, mult){ if(v===0) return 0; if(v===50) return 50; return v*mult; }
function dartLabel(v,mult){
  if(v===0) return '–';
  if(v===25) return 'OB';
  if(v===50) return 'BULL';
  return (mult===1?'S':mult===2?'D':'T') + v;
}

/* =========================================================
   THROW A DART
   ========================================================= */
function enterDart(v, mult){
  const g = state.g;
  if(!g || g.over || g._locked) return;
  const p = g.players[g.turn];
  if(p.cpu || g.aiPending) return;
  const darts = g._visit[p.id] || [];
  if(darts.length >= 3){ vibrate(20); return; }
  const now = Date.now();
  if(now - (g._tapAt||0) < 120) return;
  g._tapAt = now;

  const m = v>=25 ? 1 : mult;
  g.dartsThrown[p.id] = (g.dartsThrown[p.id]||0)+1;
  if(!g._visit[p.id]) g._visit[p.id] = [];
  const dart = { v, mult:m, score: dartScore(v,m) };
  g._visit[p.id].push(dart);
  lastDart = dart;
  applyDart(p, v, m);
  padMult = 1;
  renderGame();
  vibrate(12);
  if(g.over) return;

  if(g.mode==='x01'){ const ev = x01Live(p); if(ev.checkout){ finishVisitSoon(); return; } }
  else if(g.mode==='rtc' && p.target>20){ finishVisitSoon(); return; }
  else if(g.mode==='target' && p.cleared){ finishVisitSoon(); return; }

  const after = g._visit[p.id] || [];
  if(after.length >= 3) showEnterSheet();
}
function finishVisitSoon(){
  const g = state.g;
  g._locked = true; hideEnterSheet(); renderGame();
  setTimeout(()=>{ if(state.g!==g) return; g._locked=false; endVisit(); }, 800);
}
function x01Live(p){
  const g = state.g;
  const darts = g._visit[p.id] || [];
  const total = darts.reduce((a,d)=>a+d.score,0);
  const rem = p.score - total;
  const last = darts[darts.length-1];
  const lastIsDouble = !!(last && (last.mult===2 || last.v===50));
  let bust=false, checkout=false;
  if(darts.length){
    if(rem===0){ if(lastIsDouble) checkout=true; else bust=true; }
    else if(rem<0 || rem===1) bust=true;
  }
  return { darts, total, rem, bust, checkout };
}
function applyDart(p, v, m){
  const g = state.g;
  if(g.mode==='rtc'){
    if(v===0) return;
    const t = p.target;
    if(t<=20){ const onlyDbl = state.variant==='rtc_double'; if(onlyDbl ? (m===2 && v===t) : (v===t)){ p.target++; p.hits++; } }
    else if(v===25 || v===50){ p.target++; p.hits++; }
  }
  else if(g.mode==='target'){
    if(p.spec.kind==='num'){
      if(v===p.spec.num){ p.tHit = true; p.cleared = true; }
    } else if(p.spec.kind==='double'){
      if((m===2 && v===p.spec.num) || v===50){ p.tHit = true; p.cleared = true; }
    } else if(p.spec.kind==='checkout'){
      if(p.tBust || p.cleared) return;
      const cur = (p.tRemain==null ? p.spec.num : p.tRemain);
      const rem = cur - dartScore(v,m);
      const isDouble = (m===2 || v===50);
      if(rem < 0){ p.tBust = true; return; }
      if(rem === 0){ if(isDouble){ p.tRemain = 0; p.cleared = true; } else { p.tBust = true; } return; }
      p.tRemain = rem;
    }
  }
  else if(g.mode==='quack'){
    if(g.variant==='quack'){
      const t = p.target;
      if(t<=20 && v===t){
        if(!p._visitNums) p._visitNums = [];
        p._visitNums.push(m);
        if(p._visitNums.includes(1) && p._visitNums.includes(2) && p._visitNums.includes(3)){
          g.over = true; g.winner = p; g.winReason = 'SHANGHAI! S+D+T of ' + t;
        }
        p.score += dartScore(v,m);
      } else if(v!==0){ p.score += dartScore(v,m); }
    }
    else if(g.variant==='kill'){
      if(!p.targetAssigned){ if(m===2){ p.killer = true; p.killerNum = v; p.targetAssigned = true; } }
      else if(p.killer && m===2){
        const victim = g.players.find(o=>o!==p && o.killerNum===v && o.lives>0);
        if(victim) victim.lives--;
      }
    }
    else if(g.variant==='baseball'){ if(v===p.inning) p.runs += dartScore(v,m); }
  }
  else if(g.mode==='free'){ p.score += dartScore(v,m); }
}
function rebuildAll(){
  const g = state.g;
  if(g.mode==='x01') g.players.forEach(p=>p.score=g.startValue);
  if(g.mode==='cricket'){ g.players.forEach(p=>p.marks={20:0,19:0,18:0,17:0,16:0,15:0,25:0}); g.players.forEach(p=>p.score=0); }
  if(g.mode==='rtc') g.players.forEach(p=>{p.target=1;p.hits=0;});
  if(g.mode==='target') g.players.forEach(p=>{ p.cleared=false; p.tRemain=null; p.tBust=false; p.tHit=false; });
  if(g.mode==='quack'){
    if(g.variant==='quack') g.players.forEach(p=>{p.target=1;p.score=0;p._visitNums=[];});
    if(g.variant==='kill') g.players.forEach(p=>{p.lives=3;p.killer=false;p.targetAssigned=false;});
    if(g.variant==='baseball') g.players.forEach(p=>{p.score=0;p.runs=0;p.inning=1;});
  }
  if(g.mode==='free') g.players.forEach(p=>p.score=0);
  g.over=false; g.winner=null; g.winReason=null;

  if(g.mode==='x01'){
    g.history.forEach(h=>{ const p=g.players.find(x=>x.id===h.player); if(!p) return; if(!h.bust) p.score -= h.total; });
  }
  const allDarts = [];
  g.history.forEach(h=>h.darts.forEach(d=>allDarts.push({pid:h.player,d})));
  if(g.mode==='cricket'){
    const keys=[20,19,18,17,16,15,25];
    const marks={}; g.players.forEach(p=>marks[p.id]={20:0,19:0,18:0,17:0,16:0,15:0,25:0});
    const oppOpen=(key,pid)=>g.players.some(o=>o.id!==pid && (marks[o.id][key]||0)<3);
    allDarts.forEach(({pid,d})=>{
      const p=g.players.find(x=>x.id===pid); if(!p) return;
      const key=d.v>=25?25:d.v; if(!keys.includes(key)) return;
      const add=d.v===50?2:d.mult;
      const before=marks[pid][key]; const after=Math.min(3,before+add);
      marks[pid][key]=after;
      if(before>=3 || after>3){ const overflow=before>=3?add:after-3; if(state.variant!=='cricket_noscore' && oppOpen(key,pid)) p.score += key*overflow; }
    });
    g.players.forEach(p=>p.marks=marks[p.id]);
  } else if(g.mode!=='x01'){
    allDarts.forEach(({pid,d})=>{ const p=g.players.find(x=>x.id===pid); if(!p) return; applyDart(p,d.v,d.mult); });
  }
  Object.keys(g._visit||{}).forEach(k=>{
    const p=g.players.find(x=>x.id===+k); if(!p) return;
    (g._visit[k]||[]).forEach(d=>{
      if(g.mode==='cricket'){
        const key=d.v>=25?25:d.v;
        if(p.marks && p.marks[key]!==undefined){ p.marks[key]=Math.min(3,p.marks[key]+(d.v===50?2:d.mult)); }
      } else if(g.mode!=='x01'){ applyDart(p,d.v,d.mult); }
    });
  });
}

/* =========================================================
   POPUP ENTER SCORE
   ========================================================= */
function showEnterSheet(){
  const g = state.g;
  if(!g || g.over) return;
  const p = g.players[g.turn];
  const darts = g._visit[p.id] || [];
  if(!darts.length) return;
  const total = darts.reduce((a,d)=>a+d.score,0);
  const ev = (g.mode==='x01') ? x01Live(p) : null;
  const isBust = !!(ev && ev.bust);

  let verdict = '', cls = '';
  if(ev){
    if(ev.bust){ verdict = 'Bust — score stays at ' + p.score; cls='bust'; }
    else if(ev.checkout){ verdict = 'CHECKOUT! Leg won'; cls='win'; }
    else verdict = ev.rem + ' remaining';
  } else if(g.mode==='rtc'){
    verdict = p.target>20 ? 'Clock complete 🎯' : 'Now aiming for ' + p.target;
  } else if(g.mode==='target'){
    if(p.cleared){ verdict = 'Target cleared'; cls='win'; }
    else if(p.spec.kind==='checkout'){ verdict = p.tBust ? 'Busted — no score' : ((p.tRemain==null?p.spec.num:p.tRemain) + ' left'); }
    else verdict = 'Not cleared';
  } else {
    verdict = 'Visit total ' + total;
  }

  $('#enterSheet').className = 'enter-sheet show' + (isBust?' bust':(cls==='win'?' win':''));
  $('#enterSheet').innerHTML = `
    <div class="es-top">
      <div class="es-darts">
        ${[0,1,2].map(i=>{ const d=darts[i];
          return `<div class="es-chip"><div class="b">${d?dartLabel(d.v,d.mult):'—'}</div><div class="l">${d?d.score+' PTS':'EMPTY'}</div></div>`;
        }).join('')}
      </div>
      <div class="es-sum"><div class="n">${isBust?'BUST':total}</div><div class="l">VISIT</div></div>
    </div>
    <div class="es-verdict ${cls}">${escapeHtml(verdict)}</div>
    <div class="es-row3">
      <button class="btn" id="esBack">⌫ Undo</button>
      <button class="btn" id="esSkip">⤼ Skip</button>
      <button class="btn es-go" id="esGo">${isBust?'ENTER — BUST':'ENTER'}</button>
    </div>`;

  $('#esGo').addEventListener('click', ()=>{
    const gg = state.g; if(!gg || gg.over || gg._locked) return; hideEnterSheet(); endVisit();
  });
  $('#esBack').addEventListener('click', ()=>{
    const gg = state.g; if(!gg || gg._locked) return;
    const pp = gg.players[gg.turn];
    if((gg._visit[pp.id]||[]).length){
      gg._visit[pp.id].pop();
      gg.dartsThrown[pp.id] = Math.max(0,(gg.dartsThrown[pp.id]||1)-1);
      lastDart = (gg._visit[pp.id]||[]).slice(-1)[0] || null;
      padMult = 1; hideEnterSheet(); rebuildAll(); renderGame(); vibrate(10);
    }
  });
  $('#esSkip').addEventListener('click', ()=>{
    const gg = state.g; if(!gg || gg.over || gg._locked) return;
    gg.players[gg.turn].gaveUp = true;
    hideEnterSheet(); endVisit();
  });
}
function hideEnterSheet(){ $('#enterSheet').className = 'enter-sheet'; }

/* =========================================================
   END VISIT
   ========================================================= */
function endVisit(){
  const g = state.g;
  if(!g || g.over) return;
  hideEnterSheet();
  const p = g.players[g.turn];
  const darts = [...(g._visit[p.id] || [])];
  const total = darts.reduce((a,d)=>a+d.score,0);
  const entry = { player:p.id, darts, total, bust:false, checkout:false };

  if(g.mode==='x01'){
    const ev = x01Live(p);
    if(ev.bust){ entry.bust = true; }
    else if(ev.checkout){
      p.score = 0; entry.checkout = true; g.over = true; g.winner = p;
      g.winReason = `${g.startValue} checked out in ${countDartsUsed(p.id)+darts.length} darts`;
    } else { p.score = ev.rem; }
  }
  else if(g.mode==='cricket'){
    if(state.variant!=='cricket_noscore') computeCricketScores();
    const allClosed = x => Object.keys(x.marks).every(k=>x.marks[k]>=3);
    if(g.players.some(allClosed)){
      const closers = g.players.filter(allClosed); closers.sort((a,b)=>b.score-a.score);
      g.over = true; g.winner = closers[0];
      g.winReason = state.variant==='cricket_noscore' ? 'First to close everything' : 'Closed everything with ' + closers[0].score + ' points';
    }
  }
  else if(g.mode==='rtc'){
    const finishers = g.players.filter(x=>x.target>20 && !x.done);
    finishers.forEach(x=>{ x.done = true; x.finishOrder = g.players.filter(y=>y.done).length; });
    if(finishers.length){
      const first = [...finishers].sort((a,b)=>a.finishOrder-b.finishOrder)[0];
      g.over = true; g.winner = first;
      g.winReason = g.players.length===1 ? 'Completed the full clock' : 'First to hit the bullseye';
    }
  }
  else if(g.mode==='quack'){
    if(g.variant==='quack'){
      const done = g.players.filter(x=>x.target>20);
      if(done.length){ const best=[...g.players].sort((a,b)=>b.score-a.score)[0];
        g.over=true; g.winner=best; g.winReason='Highest Shanghai total: '+best.score; }
    }
    if(g.variant==='kill'){
      const alive = g.players.filter(x=>x.lives>0);
      const killers = alive.filter(x=>x.killer);
      if(alive.length===1 && g.players.length>1){ g.over=true; g.winner=alive[0]; g.winReason='Last one standing'; }
      else if(killers.length===1 && g.players.every(x=>x===killers[0] || x.lives<=0)){ g.over=true; g.winner=killers[0]; g.winReason='Last killer standing'; }
    }
    if(g.variant==='baseball'){
      g.players.forEach(pl=>{ if(pl.inning===9) pl.done=true; else pl.inning++; });
      if(g.players.every(pl=>pl.done || pl.inning>=10)){
        const best=[...g.players].sort((a,b)=>b.runs-a.runs)[0];
        g.over=true; g.winner=best; g.winReason='Most runs: '+best.runs;
      }
    }
  }

  g.history.push(entry);
  g._visit[p.id] = [];
  g.dartsThrown[p.id] = 0;
  if(g.mode==='quack') p._visitNums = [];
  lastDart = null; padMult = 1;

  if(g.over){ renderGame(); setTimeout(()=>endGame(), 340); return; }

  if(g.mode==='target'){
    p.tRemain = null; p.tBust = false;
    targetEndVisit(g, p);
  } else {
    advanceTurn();
  }
  renderGame();
  beginTurn();
}
function targetEndVisit(g, p){
  const cleared = p.cleared && !p.gaveUp;
  if(cleared){
    p.score += p.spec.pay; p.hits++;
    // only ONE +N on screen: the big flash. Next target & banner appear after it clears.
    g.hushTurn = true;
    flashPoints(p, p.spec.pay, ()=>{
      if(g.over) return;
      finishRound(g, p);
      if(g.over){ endGame(); return; }
      renderGame();
      beginTurn();
    });
    return;
  }
  const pending = g.players.filter(x=>!x.cleared && !x.gaveUp);
  const onlyMeLeft = (pending.length === 1 && pending[0].id === p.id);
  if(pending.length === 0 || onlyMeLeft){ finishRound(g, null); return; }
  const n = g.players.length;
  for(let i=1;i<=n;i++){
    const idx = (g.turn+i)%n;
    const q = g.players[idx];
    if(!q.cleared && !q.gaveUp){ g.turn = idx; return; }
  }
}
function finishRound(g, winner){
  const isLast = (g.targetRounds !== 0 && g.round >= g.targetRounds);
  if(g.suddenDeath){
    if(winner){ g.over = true; g.winner = winner; g.winReason = 'Sudden death'; return; }
    g.round++; setupRound(g); return;
  }
  if(isLast){
    const sorted = [...g.players].sort((a,b)=>b.score-a.score);
    if(sorted.length > 1 && sorted[0].score === sorted[1].score){ g.suddenDeath = true; g.round++; setupRound(g); return; }
    g.over = true; g.winner = sorted[0];
    g.winReason = 'POINTS: ' + sorted[0].score;
    return;
  }
  g.round++;
  setupRound(g);
}
function countDartsUsed(pid){
  return state.g.history.filter(h=>h.player===pid).reduce((a,h)=>a+h.darts.length,0);
}
function computeCricketScores(){
  const g = state.g;
  if(state.variant==='cricket_noscore'){ g.players.forEach(p=>p.score=0); return; }
  const keys=[20,19,18,17,16,15,25];
  const marks={}; g.players.forEach(p=>marks[p.id]={20:0,19:0,18:0,17:0,16:0,15:0,25:0});
  g.players.forEach(p=>p.score=0);
  const oppOpen=(key,pid)=>g.players.some(o=>o.id!==pid && (marks[o.id][key]||0)<3);
  const allDarts=[];
  g.history.forEach(h=>h.darts.forEach(d=>allDarts.push({pid:h.player,d})));
  Object.keys(g._visit||{}).forEach(k=>(g._visit[k]||[]).forEach(d=>allDarts.push({pid:+k,d})));
  allDarts.forEach(({pid,d})=>{
    const p=g.players.find(x=>x.id===pid); if(!p) return;
    const key=d.v>=25?25:d.v; if(!keys.includes(key)) return;
    const add=d.v===50?2:d.mult;
    const before=marks[pid][key]; const after=Math.min(3,before+add);
    marks[pid][key]=after;
    if(before>=3 || after>3){ const overflow=before>=3?add:after-3; if(oppOpen(key,pid)) p.score += key*overflow; }
  });
  g.players.forEach(p=>p.marks=marks[p.id]);
}
function advanceTurn(){
  const g = state.g;
  const n = g.players.length;
  for(let i=1;i<=n;i++){
    const idx = (g.turn+i)%n;
    const p = g.players[idx];
    const elim = (g.mode==='quack' && g.variant==='kill' && p.lives<=0);
    if(!elim){ g.turn = idx; return; }
  }
}
function beginTurn(){
  const g = state.g;
  if(!g) return;
  g._locked = false;
  const p = g.players[g.turn];
  const firstThisRound = g.flashFirst; g.flashFirst = false;
  turnColor(p ? p.color : '#fff');
  if(g.mode==='target' && p && p.spec && p.spec.kind==='checkout'){ p.tRemain = p.spec.num; p.tBust = false; }

  if(p && p.cpu){
    g.aiPending = true;
    renderGame();
    if(!g.hushTurn) flashTurn(p, 'CPU THROWING', 'LEVEL ' + g.level);
    g.hushTurn = false;
    setTimeout(()=>cpuThrow(p), 900);
  } else {
    g.aiPending = false;
    renderGame();
    if(g.hushTurn){ g.hushTurn = false; }   // banner suppressed right after a points win
    else if(firstThisRound) flashTurn(p, 'THROWS FIRST', 'YOUR TURN');
    else flashTurn(p, 'YOUR TURN', p.colourName);
  }
}

/* =========================================================
   END GAME + MATCH
   ========================================================= */
function endGame(){
  const g = state.g, m = state.m;
  if(!g || !g.winner) return;
  hidePoints();
  vibrate([40,60,40,60,120]);

  if(m && !g._awarded){
    g._awarded = true;
    m.wins[g.winner.id] = (m.wins[g.winner.id]||0) + 1;
    m.played++;
  }
  const isMatchMode = m && m.unit !== 'none' && m.target > 1;
  const matchWon = isMatchMode && m.wins[g.winner.id] >= m.target;

  const tally = m && isMatchMode ? `<div class="scoretally">
    ${m.players.map(p=>`<div class="tallyrow">
      <span class="tn" style="color:${p.color}">● ${escapeHtml(p.name)}</span>
      <span class="tv" style="color:${p.color}">${m.wins[p.id]||0}</span>
    </div>`).join('')}
  </div>` : '';

  openModal(`
    <div class="trophy">${matchWon?'🏆':'🎯'}</div>
    <div class="bigwin" style="color:${g.winner.color}">${escapeHtml(g.winner.name)} WINS!</div>
    <div class="win">${escapeHtml(g.winReason||'')}</div>
    ${tally}
    <div class="row">
      <button class="btn" data-close>Done</button>
      <button class="btn primary" data-again>Play again →</button>
    </div>`);

  const again = $('#modalBody [data-again]');
  if(again) again.addEventListener('click', ()=>{
    closeModal();
    if(isMatchMode && !matchWon){ startGame(); } else { startMatch(); }
  });
}

/* =========================================================
   CPU
   ========================================================= */
function landedDart(intended, lvl){
  const r = Math.random();
  if(r < lvl.acc) return {v:intended.v, mult:intended.mult};
  const spread = lvl.scatterSpread;
  const off = Math.round((Math.random()*2-1) * spread);
  let n = intended.v;
  if(intended.v>=25){ n = 1 + Math.floor(Math.random()*20); }
  else { n = intended.v + off; if(n<1) n+=20; if(n>20) n-=20; }
  const mr = Math.random();
  let mult;
  if(intended.mult===3) mult = mr<.55?1:(mr<.8?3:2);
  else if(intended.mult===2) mult = mr<.6?1:(mr<.85?2:3);
  else mult = mr<.72?1:(mr<.9?2:3);
  return {v:n, mult};
}
function chooseCpuDart(p){
  const g = state.g;
  const lvl = levelById(g.level);
  const rnd = () => Math.random();

  if(g.mode==='x01'){
    const used = (g._visit[p.id]||[]).reduce((a,d)=>a+d.score,0);
    const rem = p.score - used;
    if(rem <= 170 && rem >= 2){
      const path = routeFor(rem);
      const goForIt = path && (rem<=40 ? true : rnd() < (lvl.co*0.6 + 0.35));
      if(goForIt){
        if(rem > 40){ const next = path[0]; return landedDart({v:next.v, mult:next.mult}, lvl); }
        if(rem===50 && rnd()<0.5) return landedDart({v:25,mult:2}, lvl);
        const d = DOUBLES.find(x=>x.v*x.mult===rem) || {v:20,mult:2};
        return landedDart({v:d.v, mult:d.mult}, lvl);
      }
    }
    if(rem <= 170 && rem > 40){ if(rnd() < lvl.co) return landedDart(setupDart(rem), lvl); }
    if(rnd() < lvl.t20) return landedDart({v:20, mult:3}, lvl);
    const seg = lvl.scoreSeg;
    const v = rnd()<.5 ? 20 : (rnd()<.5 ? 19 : (rnd()<.6?18:seg+17));
    return landedDart({v:Math.max(1,Math.min(20,v)), mult:lvl.t20>.5?(rnd()<.6?3:1):1}, lvl);
  }
  if(g.mode==='cricket'){
    const keys=[20,19,18,17,16,15,25];
    const need = keys.find(k=>(p.marks[k]||0)<3);
    if(need){
      if(need===25) return landedDart({v:25,mult:1}, lvl);
      const mr=rnd(); const mult = mr<.6?1:(mr<.9?2:3);
      return landedDart({v:need, mult}, lvl);
    }
    const open = keys.filter(k=>g.players.some(o=>o!==p && (o.marks[k]||0)<3));
    const k = open[0]||20;
    return landedDart({v:k===25?25:k, mult: k===25?1:3}, lvl);
  }
  if(g.mode==='rtc'){
    const t = p.target;
    if(t>20) return landedDart(rnd()<.5? {v:25,mult:1}:{v:50,mult:1}, lvl);
    if(state.variant==='rtc_double') return landedDart({v:t, mult: rnd()<.6?2:1}, lvl);
    return landedDart({v:t, mult: rnd()<.7?1:2}, lvl);
  }
  if(g.mode==='target'){
    const kind = p.spec.kind;
    if(kind==='num') return landedDart({v:p.spec.num, mult: rnd()<.6?1:2}, lvl);
    if(kind==='double') return landedDart({v:p.spec.num, mult:2}, lvl);
    if(kind==='checkout'){
      const remLeft = (p.tRemain==null?p.spec.num:p.tRemain);
      if(remLeft > 40) return landedDart(setupDart(remLeft), lvl);
      if(remLeft === 50 && rnd()<0.5) return landedDart({v:25,mult:2}, lvl);
      const d = DOUBLES.find(x=>x.v*x.mult===remLeft) || {v:20,mult:2};
      return landedDart({v:d.v, mult:d.mult}, lvl);
    }
    return landedDart({v:20,mult:1}, lvl);
  }
  if(g.mode==='quack'){
    if(g.variant==='quack'){ const t=Math.min(20,p.target); return landedDart({v:t, mult:rnd()<.5?1:rnd()<.85?2:3}, lvl); }
    if(g.variant==='kill') return landedDart({v:1+Math.floor(rnd()*20), mult:rnd()<.5?2:1}, lvl);
    if(g.variant==='baseball'){ const t=Math.min(9,Math.max(1,p.inning)); return landedDart({v:t, mult:rnd()<.6?1:rnd()<.9?2:3}, lvl); }
  }
  if(g.mode==='free') return landedDart({v:20,mult:3}, lvl);
  return landedDart({v:20,mult:1}, lvl);
}
function cpuThrow(p){
  const g = state.g;
  if(!g || g.over || !p.cpu){ if(g){ g.aiPending=false; renderGame(); } return; }
  const dart = chooseCpuDart(p);
  g.dartsThrown[p.id] = (g.dartsThrown[p.id]||0)+1;
  if(!g._visit[p.id]) g._visit[p.id]=[];
  const d = {...dart, score:dartScore(dart.v,dart.mult)};
  g._visit[p.id].push(d);
  lastDart = d;
  applyDart(p, dart.v, dart.mult);
  padMult = 1;
  renderGame();
  if(g.over){ g._locked=true; setTimeout(()=>{ if(state.g!==g) return; g._locked=false; endVisit(); }, 700); return; }
  if(g.mode==='x01'){
    const ev = x01Live(p);
    if(ev.checkout || ev.bust){ g._locked = true; setTimeout(()=>{ if(state.g!==g) return; g._locked=false; endVisit(); }, 750); return; }
  } else if(g.mode==='rtc' && p.target>20){
    g._locked = true; setTimeout(()=>{ if(state.g!==g) return; g._locked=false; endVisit(); }, 750); return;
  } else if(g.mode==='target' && p.cleared){
    g._locked = true; setTimeout(()=>{ if(state.g!==g) return; g._locked=false; endVisit(); }, 750); return;
  }
  if((g._visit[p.id]||[]).length >= 3){
    setTimeout(()=>{ if(state.g!==g) return; g._locked=false; endVisit(); }, 480);
  } else {
    setTimeout(()=>cpuThrow(p), 560);
  }
}

/* =========================================================
   DARTBOARD
   ========================================================= */
const BOARD_ORDER = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const SEG_ANGLE = 360/20;
const R = { bull:0.062, outerBull:0.108, trebleIn:0.556, trebleOut:0.636, doubleIn:0.916, doubleOut:1.0 };
function polar(cx,cy,r,deg){ const a=(deg-90)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
function ringPath(cx,cy,r1,r2,sD,eD){
  const [x1,y1]=polar(cx,cy,r1,sD),[x2,y2]=polar(cx,cy,r2,sD),[x3,y3]=polar(cx,cy,r2,eD),[x4,y4]=polar(cx,cy,r1,eD);
  const large = Math.abs(eD-sD)>180?1:0;
  return `M${x1} ${y1} L${x2} ${y2} A${r2} ${r2} 0 ${large} 1 ${x3} ${y3} L${x4} ${y4} A${r1} ${r1} 0 ${large} 0 ${x1} ${y1} Z`;
}
function boardSVG(withTicks){
  const S=400, cx=S/2, cy=S/2;
  const rad = withTicks ? (S/2-42) : (S/2-26);
  const labelR = rad + (withTicks ? 28 : 13);
  let defs = `<defs>
      <radialGradient id="boardBg" cx="50%" cy="42%" r="70%"><stop offset="0%" stop-color="#1b2438"/><stop offset="100%" stop-color="#0d1322"/></radialGradient>
      <radialGradient id="bullG" cx="50%" cy="40%" r="65%"><stop offset="0%" stop-color="#4dff8e"/><stop offset="100%" stop-color="#00b866"/></radialGradient>
      <radialGradient id="boardVignette" cx="50%" cy="50%" r="62%"><stop offset="70%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,.55)"/></radialGradient>
    </defs>`;
  let out = `<circle cx="${cx}" cy="${cy}" r="${rad+20}" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/>`;
  out += `<circle cx="${cx}" cy="${cy}" r="${rad}" fill="url(#boardBg)"/>`;
  const dark='#141b2c', light='#1c2539', redR='#c0263f', greenR='#0f7a52';
  for(let i=0;i<20;i++){
    const num=BOARD_ORDER[i], a0=i*SEG_ANGLE-SEG_ANGLE/2, a1=a0+SEG_ANGLE;
    const isEven=i%2===0, base=isEven?dark:light, ringCol=isEven?redR:greenR;
    out += `<path class="seg s${num} single" data-num="${num}" d="${ringPath(cx,cy,rad*R.outerBull,rad*R.trebleIn,a0,a1)}" fill="${base}"/>`;
    out += `<path class="seg s${num} single" data-num="${num}" d="${ringPath(cx,cy,rad*R.trebleOut,rad*R.doubleIn,a0,a1)}" fill="${base}"/>`;
    out += `<path class="seg s${num} treble" data-num="${num}" d="${ringPath(cx,cy,rad*R.trebleIn,rad*R.trebleOut,a0,a1)}" fill="${ringCol}"/>`;
    out += `<path class="seg s${num} double" data-num="${num}" d="${ringPath(cx,cy,rad*R.doubleIn,rad*R.doubleOut,a0,a1)}" fill="${ringCol}"/>`;
    const [lx,ly]=polar(cx,cy,labelR,(a0+a1)/2);
    out += `<text class="numlabel n${num}" data-num="${num}" x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-size="${withTicks?17:19}" fill="#8b96b4">${num}</text>`;
  }
  out += `<circle class="seg sm25 obull" data-num="25" cx="${cx}" cy="${cy}" r="${rad*R.outerBull}" fill="${greenR}" stroke="#0c4a33" stroke-width="1"/>`;
  out += `<circle class="seg sbull bull" data-num="50" cx="${cx}" cy="${cy}" r="${rad*R.bull}" fill="url(#bullG)"/>`;
  out += `<circle cx="${cx}" cy="${cy}" r="${rad*R.bull}" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="1"/>`;
  for(let i=0;i<20;i++){
    const a=i*SEG_ANGLE-SEG_ANGLE/2;
    const [x1,y1]=polar(cx,cy,rad*R.outerBull,a),[x2,y2]=polar(cx,cy,rad*R.doubleOut,a);
    out += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(180,195,225,.28)" stroke-width="1.4"/>`;
  }
  [R.outerBull,R.trebleIn,R.trebleOut,R.doubleIn,R.doubleOut].forEach(rr=>{
    out += `<circle cx="${cx}" cy="${cy}" r="${rad*rr}" fill="none" stroke="rgba(180,195,225,.22)" stroke-width="1.3"/>`;
  });
  if(withTicks){
    const t1=rad*1.0, t2=rad*1.088;
    for(let i=0;i<20;i++){
      const num=BOARD_ORDER[i];
      const a0=i*SEG_ANGLE-SEG_ANGLE/2+1.6, span=SEG_ANGLE-3.2;
      for(let k=0;k<3;k++){ const s=a0+k*span/3+0.55, e=a0+(k+1)*span/3-0.55;
        out += `<path class="cr-tick" data-tick="${num}:${k}" d="${ringPath(cx,cy,t1,t2,s,e)}" fill="rgba(255,255,255,.07)"/>`; }
    }
    const b1=rad*0.125, b2=rad*0.185;
    for(let k=0;k<3;k++){ const s=-60+k*120, e=s+120-9;
      out += `<path class="cr-tick" data-tick="25:${k}" d="${ringPath(cx,cy,b1,b2,s,e)}" fill="rgba(255,255,255,.07)"/>`; }
  }
  out += `<circle cx="${cx}" cy="${cy}" r="${rad}" fill="url(#boardVignette)" pointer-events="none"/>`;
  out += `<circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="2"/>`;
  const id = withTicks ? 'cricketBoard' : 'rtcBoard';
  return `<svg id="${id}" viewBox="0 0 ${S} ${S}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${defs}${out}</svg>`;
}
function paintRtcBoard(host, player){
  const target = player.target || 1;
  host.querySelectorAll('.seg').forEach(el=>{
    const num = el.dataset.num;
    el.classList.remove('hit','next','dead','score');
    if(num==='50'||num==='25'){ if(target>20) el.classList.add('hit'); else if(target===21) el.classList.add('next'); return; }
    const n=+num;
    if(n<target) el.classList.add('hit'); else if(n===target) el.classList.add('next');
  });
  host.querySelectorAll('.numlabel').forEach(el=>{
    const n=+el.dataset.num;
    if(n<target){ el.setAttribute('fill','#3a445c'); el.style.opacity='.35'; el.style.filter='none'; }
    else if(n===target){ el.setAttribute('fill','#ff2d5e'); el.style.filter='drop-shadow(0 0 6px #ff2d68)'; el.style.opacity='1'; }
    else { el.setAttribute('fill','#8b96b4'); el.style.opacity='1'; el.style.filter='none'; }
  });
}
function paintCricketBoard(host, g, p){
  const scoreOn = state.variant !== 'cricket_noscore';
  const own = k => (p.marks[k]||0);
  const others = g.players.filter(o=>o.id!==p.id);
  const deadFor = k => others.length>0 && others.every(o=>(o.marks[k]||0)>=3);
  const keyOf = num => (num==='50'||num==='25') ? 25 : +num;
  host.querySelectorAll('.seg').forEach(el=>{
    const key = keyOf(el.dataset.num); const m = own(key);
    el.classList.remove('hit','next','dead','score');
    if(m>=3 && deadFor(key)) el.classList.add('dead');
    else if(m>=3 && scoreOn) el.classList.add('score');
  });
  host.querySelectorAll('.numlabel').forEach(el=>{
    const key = +el.dataset.num; const m = own(key);
    if(m>=3 && deadFor(key)){ el.setAttribute('fill','#3a445c'); el.style.opacity='.35'; el.style.filter='none'; }
    else if(m>=3){ el.setAttribute('fill','#ffd35c'); el.style.filter='drop-shadow(0 0 6px #ffd35c)'; el.style.opacity='1'; }
    else { el.setAttribute('fill','#8b96b4'); el.style.opacity='1'; el.style.filter='none'; }
  });
  host.querySelectorAll('.cr-tick').forEach(el=>{
    const parts = el.dataset.tick.split(':');
    const key = parts[0]==='25' ? 25 : +parts[0]; const k = +parts[1];
    const m = Math.min(3, own(key)); const dead = (m>=3 && deadFor(key));
    if(k < m) el.setAttribute('fill', dead ? 'rgba(120,132,160,.35)' : p.color);
    else el.setAttribute('fill','rgba(255,255,255,.07)');
  });
}

/* =========================================================
   RENDER
   ========================================================= */
function renderGame(){
  const g = state.g;
  if(!g) return;
  const p = g.players[g.turn];
  const ev = (g.mode==='x01') ? x01Live(p) : null;
  turnColor(p ? p.color : '#fff');

  $('#gTitle').textContent = titleFor(g);
  $('#gSub').textContent = subtitleFor(g);

  const m = state.m;
  $('#scoreHead').innerHTML = g.players.map(pl => {
    const thrown = g.dartsThrown[pl.id]||0;
    const isTurn = pl.id===g.turn && !g.over;
    let val='', label='';
    if(g.mode==='x01'){ val = (isTurn && ev) ? (ev.bust?'BUST':ev.rem) : pl.score; label='SCORE'; }
    else if(g.mode==='target'){ val = pl.score; label='POINTS'; }
    else { val = bigScore(pl); label = scoreLabel(g.mode); }
    const turnStyle = isTurn ? ` style="border-color:${pl.color};background:linear-gradient(160deg,${hexA(pl.color,.18)},var(--panel))"` : '';
    const legs = (m && m.unit!=='none' && m.target>1) ? `<span class="legs" style="color:${pl.color}">${m.wins[pl.id]||0}</span>` : '';
    return `<div class="pcard ${isTurn?'turn':''}"${turnStyle}>
      <div class="toprow">
        <div class="nm" style="color:${pl.color}">● ${escapeHtml(pl.name)}${pl.cpu?' 🤖':''}</div>
        ${legs}
      </div>
      <div class="sc-label" style="color:${isTurn?hexA(pl.color,.9):'var(--muted)'}">${label}</div>
      <div class="sc" style="color:${isTurn?pl.color:'inherit'}">${val}</div>
      <div class="darts">${[0,1,2].map(i=>`<i class="${i<thrown?'on':''}"></i>`).join('')}</div>
    </div>`;
  }).join('');

  const banner = $('#turnBanner');
  banner.classList.toggle('active', !g.over);
  $('#turnWho').innerHTML = g.over ? 'Game over'
    : `<span style="color:${p.color}">●</span> ${escapeHtml(p.name)}${p.cpu?' (CPU)':''} to throw`;
  const hint = $('#turnHint');
  hint.textContent = hintFor(g, p, ev);
  hint.className = 'hint' + ((ev&&ev.bust)?' bust':'');
  const tl = $('#turnLeft');
  if(g.mode==='x01'){
    tl.textContent = ev.bust?'BUST':ev.rem; tl.className = ev.bust?'bust':'';
    $('#turnLeftLbl').textContent = 'LEFT';
  } else if(g.mode==='target' && p.spec.kind==='checkout' && !p.cleared){
    const rem = (p.tRemain==null?p.spec.num:p.tRemain);
    tl.textContent = p.tBust ? 'BUST' : rem; tl.className = p.tBust?'bust':'';
    $('#turnLeftLbl').textContent = 'LEFT';
  } else {
    tl.textContent = (g.dartsThrown[p.id]||0)+'/3'; tl.className='';
    $('#turnLeftLbl').textContent = 'DARTS';
  }

  const visit = g._visit[p.id] || [];
  const thrownNow = (g.dartsThrown[p.id]||0);
  $('#slotRow').innerHTML = [0,1,2].map(i=>{
    const d = visit[i];
    const col = i<thrownNow && p.color ? p.color : null;
    return `<div class="slot ${d?'filled':''}"${col?` style="border-color:${col};background:${hexA(col,.12)}"`:''}>
      <div class="big">${d?dartLabel(d.v,d.mult):'—'}</div>
      <div class="lbl">${d?d.score+' PTS':'DART '+(i+1)}</div>
    </div>`;
  }).join('');

  renderModePanel(g, p, ev);

  const blocked = g.over || p.cpu || g.aiPending || g._locked;
  $('#padBox').style.opacity = blocked ? '.45' : '1';
  $('#padBox').style.pointerEvents = blocked ? 'none' : 'auto';
  $('#padBox').classList.toggle('turn-glow', !g.over);
  renderPad();
}
function scoreLabel(mode){
  if(mode==='cricket') return 'POINTS';
  if(mode==='rtc') return 'TARGET';
  if(mode==='quack') return 'SCORE';
  if(mode==='free') return 'SCORE';
  return '';
}
function titleFor(g){
  if(g.mode==='x01') return g.startValue + ' Double Out';
  if(g.mode==='target') return g.suddenDeath ? 'Target Practice · Sudden Death' : 'Target Practice';
  const m = MODES.find(x=>x.id===g.mode);
  const v = m.variants.find(x=>x.id===g.variant);
  return v ? v.label.split('(')[0].trim() : m.name;
}
function subtitleFor(g){
  const m = state.m;
  const hasCpu = g.players.some(p=>p.cpu);
  const lvl = hasCpu ? ' · CPU L'+g.level : '';
  if(g.mode==='target') return 'Target ' + g.round + '/' + g.targetRounds + lvl;
  if(m && m.unit!=='none' && m.target>1) return (m.unit==='legs'?'Leg ':'Game ') + m.played + '/' + ((m.target*2)-1) + lvl;
  return MODES.find(x=>x.id===g.mode).name + ' · ' + g.players.length + ' players' + lvl;
}
function bigScore(p){
  const g=state.g;
  if(g.mode==='cricket') return p.score;
  if(g.mode==='rtc') return p.target>20 ? '✓' : p.target;
  if(g.mode==='target') return p.score;
  if(g.mode==='quack'){
    if(g.variant==='quack') return p.score;
    if(g.variant==='kill') return p.lives>0? '❤'.repeat(p.lives) : '✖';
    if(g.variant==='baseball') return (p.runs||0);
  }
  if(g.mode==='free') return p.score;
  return '';
}
function hintFor(g,p,ev){
  if(g.over) return g.winReason || '';
  if(p.cpu) return 'CPU is throwing…';
  if(g.mode==='x01'){
    if(ev && ev.bust) return 'Bust — tap ENTER to void this visit';
    const rem = ev ? ev.rem : p.score;
    const route = routeFor(rem);
    if(route) return 'Finish: ' + route.map(d=>d.label).join(' → ');
    if(rem<=170) return 'No 3-dart finish from '+rem+' — set up a double';
    return 'Aim T20 to bring it down';
  }
  const th = g.dartsThrown[p.id]||0;
  if(g.mode==='cricket') return 'Close 20→15 and the bull, then score';
  if(g.mode==='rtc'){ if(p.target>20) return 'Hit the BULLSEYE 🎯'; if(state.variant==='rtc_double') return 'Hit DOUBLE ' + p.target; return 'Hit ' + p.target; }
  if(g.mode==='target'){
    if(p.spec.kind==='checkout'){
      if(p.cleared) return 'Cleared!';
      if(p.tBust) return 'Busted this visit';
      const rem = (p.tRemain==null?p.spec.num:p.tRemain);
      const dartsLeft = Math.max(0, 3 - (g.dartsThrown[p.id]||0));
      const hint = routeLeft(rem, dartsLeft);
      return rem + ' left — finish on a double' + (hint ? ('  ·  ' + hint.map(d=>d.label).join(' → ')) : '');
    }
    return 'Hit ' + p.spec.text + ' for ' + p.spec.pay + ' point' + (p.spec.pay>1?'s':'');
  }
  if(g.mode==='quack'){
    if(g.variant==='quack') return 'Aim for '+p.target+' — S+D+T wins instantly!';
    if(g.variant==='kill') return p.killer? 'Hit an opponent’s double' : 'Hit any double to become a killer';
    if(g.variant==='baseball') return 'Inning '+Math.min(9,p.inning);
  }
  return th===0 ? 'Throw your darts' : (3-th)+' dart'+((3-th)>1?'s':'')+' left';
}
function renderModePanel(g,p,ev){
  const box = $('#modePanel');

  if(g.mode==='x01'){
    let card;
    if(ev && ev.bust){
      card = `<div class="finish-card bust"><div class="fnum">BUST</div>
        <div><div class="flabel">VISIT VOIDED</div>
        <div class="froute"><span class="note">Score stays at ${p.score}</span></div></div></div>`;
    } else {
      const rem = ev ? ev.rem : p.score;
      const route = routeFor(rem);
      card = `<div class="finish-card ${route?'':'bogey'}">
        <div class="fnum">${rem}</div>
        <div><div class="flabel">CHECKOUT</div>
        <div class="froute">${ route ? route.map((d,i)=>`${i?'<span class="farrow">→</span>':''}<span class="fchip">${d.label}</span>`).join('')
          : `<span class="note">${rem>170 ? 'reduce to 170 or less' : 'set up a double'}</span>` }</div></div></div>`;
    }
    box.innerHTML = card + `<div class="hist"><div class="hh">VISIT LOG</div>${histRows(g)}</div>`;
    return;
  }

  if(g.mode==='rtc'){
    box.innerHTML = `<div class="board-wrap" id="boardHost">${boardSVG(false)}</div>`;
    paintRtcBoard($('#boardHost'), p);
    return;
  }

  if(g.mode==='cricket'){
    const keys=[20,19,18,17,16,15,25];
    box.innerHTML = `<div class="board-wrap" id="cricketHost">${boardSVG(true)}</div>
      <div class="cr-strip">
        ${keys.map(k=>{
          const ownM = p.marks[k]||0;
          return `<div class="mc ${ownM>=3?'closed':''}">
            <span style="color:${ownM>=3?'var(--green)':'var(--muted)'}">${k===25?'B':k}</span>
            ${g.players.map(pl=>{ const mm=Math.min(3,pl.marks[k]||0);
              return `<i style="background:${pl.color};opacity:${mm? (0.35+0.65*(mm/3)) : 0.14}"></i>`; }).join('')}
          </div>`;
        }).join('')}
      </div>`;
    paintCricketBoard($('#cricketHost'), g, p);
    return;
  }

  if(g.mode==='target'){
    if(p.spec.kind==='checkout'){
      const rem = (p.tRemain==null?p.spec.num:p.tRemain);
      const dartsLeft = Math.max(0, 3 - (g.dartsThrown[p.id]||0));
      const hint = (rem>0 && !p.tBust) ? routeLeft(rem, dartsLeft) : null;
      const bigTxt = p.cleared ? 'CLEARED' : (p.tBust ? 'BUST' : rem);
      const subTxt = p.tBust ? 'no score' : (hint ? hint.map(d=>d.label).join(' → ') : 'set up a double');
      box.innerHTML = `
        <div class="target-box" style="border-color:${hexA(p.color,.45)}">
          <div class="tlabel">CHECKOUT · WORTH ${p.spec.pay} PTS</div>
          <div class="tbig ${p.cleared?'win':''}">${p.cleared ? escapeHtml(String(p.spec.num)) : bigTxt}</div>
          ${p.cleared ? '' : `<div class="checkout-live" style="border-color:${hexA(p.color,.6)}">
            <div class="cl-num" style="color:${p.tBust?'var(--red)':p.color}">${subTxt}</div>
            <div class="cl-lbl">${p.tBust?'BUSTED':'ROUTE'}</div>
          </div>`}
        </div>
        <div class="hist" style="margin-top:7px"><div class="hh">VISIT LOG</div>${histRows(g)}</div>`;
      return;
    }
    box.innerHTML = `
      <div class="target-box" style="border-color:${hexA(p.color,.45)}">
        <div class="tlabel">${p.spec.kind==='num'?'HIT THE NUMBER':'HIT THE DOUBLE'} · WORTH ${p.spec.pay} PTS</div>
        <div class="tbig plain">${escapeHtml(String(p.spec.text))}</div>
      </div>
      <div class="hist" style="margin-top:7px"><div class="hh">VISIT LOG</div>${histRows(g)}</div>`;
    return;
  }

  box.innerHTML = `<div class="hist"><div class="hh">VISIT LOG</div>${histRows(g)}</div>`;
}
function histRows(g){
  const rows = [...g.history].slice(-40).reverse();
  if(!rows.length) return `<div style="padding:14px 8px;color:var(--muted);font-size:12.5px;font-weight:600">No throws yet</div>`;
  return rows.map(h=>{
    const p = g.players.find(x=>x.id===h.player);
    const ds = h.darts.map(d=>dartLabel(d.v,d.mult)).join(' ');
    return `<div class="hrow"><div class="hn" style="color:${p.color}">● ${escapeHtml(p.name)}</div>
      <div class="hd">${ds || '–'}</div>
      <div class="hv ${h.bust?'bust':''}">${h.bust?'BUST':h.total}</div></div>`;
  }).join('');
}

/* =========================================================
   MODAL
   ========================================================= */
function openModal(html){
  $('#modalBody').innerHTML = html;
  $('#overlay').classList.add('show');
  $('#modalBody').querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
}
function closeModal(){ $('#overlay').classList.remove('show'); }
$('#btnRestart').addEventListener('click', ()=>{
  openModal(`<div class="trophy">⟳</div><h2>Restart?</h2><p>This game will start over.</p>
    <div class="row"><button class="btn" data-close>Cancel</button><button class="btn primary" data-yes>Restart</button></div>`);
  $('#modalBody [data-yes]').addEventListener('click', ()=>{ closeModal(); startGame(); });
});
$('#btnQuit').addEventListener('click', ()=>{
  openModal(`<div class="trophy">🚪</div><h2>Leave game?</h2><p>Everything is discarded.</p>
    <div class="row"><button class="btn" data-close>Stay</button><button class="btn primary" data-yes>Leave</button></div>`);
  $('#modalBody [data-yes]').addEventListener('click', ()=>{ closeModal(); hideEnterSheet(); hidePoints(); $('#turnFlash').classList.remove('show'); state.g=null; state.m=null; renderPlayers(); renderOpp(); show('scr-players'); });
});
$('#btnUndo').addEventListener('click', ()=>{
  const g = state.g; if(!g || g._locked) return;
  hideEnterSheet(); hidePoints();
  const p = g.players[g.turn];
  if((g._visit[p.id]||[]).length){
    g._visit[p.id].pop();
    g.dartsThrown[p.id] = Math.max(0,(g.dartsThrown[p.id]||1)-1);
    lastDart = (g._visit[p.id]||[]).slice(-1)[0] || null;
    padMult = 1; rebuildAll(); renderGame(); vibrate(10); return;
  }
  const last = g.history.pop();
  if(!last){ flashWarn('Nothing to undo.'); return; }
  g.turn = g.players.findIndex(x=>x.id===last.player);
  g._visit[last.player] = last.darts.map(d=>({...d}));
  g.dartsThrown[last.player] = last.darts.length;
  lastDart = (g._visit[last.player]||[]).slice(-1)[0] || null;
  padMult = 1; rebuildAll(); renderGame(); vibrate(10);
});
$('#btnFullscreen').addEventListener('click', ()=>{ toggleFullscreen(); vibrate(8); });
document.addEventListener('fullscreenchange', ()=>setTimeout(syncVh,200));
document.addEventListener('webkitfullscreenchange', ()=>setTimeout(syncVh,200));

   INIT
   ========================================================= */
renderModes();
buildKeypad();
renderPad();
setView('fit');
document.addEventListener('dblclick', e=>e.preventDefault(), {passive:false});
document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
</script>
