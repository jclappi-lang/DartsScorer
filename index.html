<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e17">
<title>Darts Scorer</title>
<style>
  :root{
    --bg:#0a0e17;
    --panel:#151c2e;
    --panel2:#1c2438;
    --line:rgba(255,255,255,.08);
    --txt:#eef2ff;
    --muted:#8b96b4;
    --accent:#ff2d68;
    --accent2:#00e0c6;
    --gold:#ffd35c;
    --green:#2ee6a8;
    --red:#ff4d6d;
    --shadow:0 18px 40px -18px rgba(0,0,0,.9);
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{min-height:100%;overflow-x:hidden}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 15% -10%,#1d2743 0%,transparent 55%),
               radial-gradient(900px 700px at 110% 110%,#2a1230 0%,transparent 55%),
               var(--bg);
    background-attachment:fixed;
    color:var(--txt);
    -webkit-font-smoothing:antialiased;
    user-select:none;
    touch-action:manipulation;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .screen{display:none;flex-direction:column}
  .screen.active{display:flex;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .topbar{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.5px;font-size:19px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  .brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:2.4px}
  .spacer{flex:1}
  .btn{
    border:1px solid var(--line);background:var(--panel);color:var(--txt);
    border-radius:14px;padding:14px 18px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .1s,filter .15s,background .15s;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;
  }
  .btn:active{transform:scale(.955)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#ff6a3d);border-color:transparent;box-shadow:0 10px 24px -12px var(--accent)}
  .btn.ghost{background:transparent}
  .btn.wide{width:100%}
  .btn.sm{padding:9px 14px;font-size:13px;min-height:40px;border-radius:11px}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .icon-btn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:18px}

  h2.title{font-size:26px;font-weight:800;letter-spacing:-.4px}
  .sub{color:var(--muted);font-size:13px;font-weight:600;margin-top:4px}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 18px}

  /* ---------- HOME ---------- */
  .hero{padding:8px 18px 14px;flex-shrink:0}
  .hero h1{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1}
  .hero h1 span{background:linear-gradient(120deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);font-size:14px;margin-top:8px;font-weight:600}
  .grid{display:grid;gap:14px}
  .mode-card{
    position:relative;overflow:hidden;border-radius:var(--r);padding:20px;
    background:linear-gradient(150deg,var(--panel2),var(--panel));
    border:1px solid var(--line);cursor:pointer;transition:transform .12s,border-color .2s;
    box-shadow:var(--shadow);text-align:left;
  }
  .mode-card:active{transform:scale(.98)}
  .mode-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 18px 44px -20px var(--accent)}
  .mode-card .ico{font-size:30px;margin-bottom:10px;display:block}
  .mode-card h3{font-size:19px;font-weight:800}
  .mode-card p{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:5px;line-height:1.45}
  .mode-card .tag{position:absolute;top:16px;right:16px;font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--accent2);border:1px solid rgba(0,224,198,.35);padding:4px 9px;border-radius:20px}

  /* ---------- PLAYERS ---------- */
  .plist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .prow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:10px 12px}
  .avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:17px;color:#08101c;flex-shrink:0}
  .pname-input{
    flex:1;background:transparent;border:none;color:var(--txt);font-size:17px;font-weight:700;
    font-family:inherit;outline:none;min-width:0;padding:6px 2px;
  }
  .pname-input::placeholder{color:#5a6580}
  .del{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:17px;cursor:pointer}
  .del:active{color:var(--red);border-color:var(--red)}
  .setup-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
  .setup-box h4{font-size:12px;letter-spacing:1.8px;color:var(--muted);font-weight:800;margin-bottom:12px}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:10px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
  .chip.on{background:linear-gradient(135deg,var(--accent),#ff6a3d);color:#fff;border-color:transparent}
  .chip[disabled]{opacity:.4;pointer-events:none}
  .warn{background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.35);color:#ffb3c1;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:700;margin-top:12px}
  .footer-bar{flex-shrink:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(10,14,23,.9)}

  /* ---------- SCORER ---------- */
  .score-head{display:flex;gap:10px;padding:12px 16px 6px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
  .score-head::-webkit-scrollbar{display:none}
  .pcard{
    flex:1 1 140px;min-width:132px;border-radius:16px;padding:12px 14px;
    background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;
    transition:border-color .2s,background .2s;
  }
  .pcard.turn{border-color:var(--accent);background:linear-gradient(160deg,rgba(255,45,104,.16),var(--panel))}
  .pcard.turn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .pcard .nm{font-size:12.5px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard.turn .nm{color:#fff}
  .pcard .sc{font-size:30px;font-weight:900;letter-spacing:-1.5px;margin-top:2px;font-variant-numeric:tabular-nums}
  .pcard .meta{font-size:11px;font-weight:700;color:var(--muted);margin-top:3px}
  .pcard .darts{display:flex;gap:4px;margin-top:7px}
  .pcard .darts i{width:100%;height:4px;border-radius:3px;background:rgba(255,255,255,.12)}
  .pcard .darts i.on{background:var(--accent2)}
  .pcard.turn .darts i.on{background:var(--accent)}

  .stage{display:flex;gap:14px;padding:8px 16px 16px;align-items:flex-start}
  .left{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
  .right{width:min(46%,430px);display:flex;flex-direction:column;gap:12px;min-width:0}

  .turn-banner{
    border-radius:16px;padding:14px 18px;background:var(--panel);border:1px solid var(--line);
    display:flex;align-items:center;gap:14px;
  }
  .turn-banner .who{font-size:19px;font-weight:900}
  .turn-banner .hint{color:var(--muted);font-size:12.5px;font-weight:700;margin-top:2px}
  .turn-banner .left-count{margin-left:auto;text-align:right}
  .turn-banner .left-count b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
  .turn-banner .left-count span{display:block;font-size:10px;letter-spacing:1.6px;color:var(--muted);font-weight:800}

  .slot-row{display:flex;gap:10px}
  .slot{
    flex:1;border-radius:15px;border:1.5px dashed var(--line);background:rgba(255,255,255,.02);
    height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  }
  .slot.filled{border-style:solid;border-color:var(--accent2);background:rgba(0,224,198,.09)}
  .slot .big{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
  .slot .lbl{font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--muted)}
  .slot.filled .lbl{color:var(--accent2)}

  .hist{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 10px;max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .hist .hh{font-size:10px;letter-spacing:1.8px;color:var(--muted);font-weight:800;padding:8px 6px 6px;position:sticky;top:0;background:var(--panel)}
  .hrow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid rgba(255,255,255,.05);font-size:13px}
  .hrow .hn{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hrow .hd{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .hrow .hv{font-weight:900;width:46px;text-align:right;font-variant-numeric:tabular-nums}
  .hrow .hv.bust{color:var(--red)}

  /* keypad — natural size, never crushed */
  .pad{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
  .pad-display{display:flex;align-items:center;gap:10px;background:#0c111d;border-radius:13px;padding:10px 14px;flex-shrink:0}
  .pad-display .v{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px;flex:1}
  .pad-display .m{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--muted)}
  .mult-row{display:flex;gap:8px;flex-shrink:0}
  .mult{
    flex:1;border-radius:12px;padding:11px 0;font-weight:900;font-size:15px;cursor:pointer;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);text-align:center;
  }
  .mult.on{background:linear-gradient(135deg,var(--accent2),#29ff8f);color:#062018;border-color:transparent}
  .mult small{display:block;font-size:9px;letter-spacing:1.2px;font-weight:800;opacity:.75;margin-top:2px}
  .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .key{
    border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
    font-size:18px;font-weight:800;cursor:pointer;font-family:inherit;
    display:grid;place-items:center;height:52px;transition:transform .08s,background .15s;
    font-variant-numeric:tabular-nums;
  }
  .key:active{transform:scale(.93);background:#2b3654}
  .key.bull{background:rgba(255,45,104,.16);border-color:rgba(255,45,104,.45);color:#ff9ab4;font-size:15px}
  .key.zero{background:rgba(255,255,255,.03);color:var(--muted)}
  .key.enter{background:linear-gradient(135deg,var(--green),#19c98d);color:#052018;border-color:transparent;grid-column:span 5;font-size:16px;letter-spacing:1.2px;height:56px}
  .key.back{background:rgba(255,77,109,.14);border-color:rgba(255,77,109,.4);color:#ffb3c1;grid-column:span 5;font-size:14px;letter-spacing:1px;height:46px}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(5,8,14,.86);backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;padding:22px;z-index:50;
  }
  .overlay.show{display:flex;animation:fade .2s}
  .modal{
    background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:24px;padding:30px 26px;max-width:440px;width:100%;text-align:center;
    box-shadow:0 30px 70px -20px #000;animation:pop .3s cubic-bezier(.2,1.4,.5,1);
    max-height:88vh;overflow-y:auto;
  }
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .modal .trophy{font-size:56px;line-height:1}
  .modal h2{font-size:29px;font-weight:900;margin-top:12px;letter-spacing:-.6px}
  .modal .win{font-size:19px;font-weight:900;color:var(--gold);margin-top:8px}
  .modal p{color:var(--muted);font-size:13.5px;font-weight:600;margin-top:10px;line-height:1.55}
  .modal .row{display:flex;gap:10px;margin-top:24px}
  .modal .row .btn{flex:1}

  /* round the clock board */
  .rtc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
  .rtc-cell{
    aspect-ratio:1;border-radius:11px;background:var(--panel2);border:1px solid var(--line);
    display:grid;place-items:center;font-weight:900;font-size:clamp(12px,2.2vw,17px);color:var(--muted);
    transition:all .2s;
  }
  .rtc-cell.done{background:rgba(46,230,168,.16);border-color:rgba(46,230,168,.5);color:var(--green)}
  .rtc-cell.next{background:linear-gradient(135deg,var(--accent),#ff6a3d);color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px var(--accent)}

  .cricket-panel{display:flex;flex-direction:column;gap:8px}
  .cr-row{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:9px 12px}
  .cr-num{font-size:17px;font-weight:900;color:var(--muted)}
  .cr-marks{display:flex;gap:6px;flex-wrap:wrap}
  .mchip{padding:6px 11px;border-radius:9px;background:rgba(255,255,255,.05);font-size:12px;font-weight:800;color:var(--muted);border:1px solid var(--line);display:flex;gap:6px;align-items:center}
  .mchip b{color:var(--txt)}
  .mchip.hit{border-color:rgba(0,224,198,.5);background:rgba(0,224,198,.12)}
  .mchip.closed{border-color:rgba(46,230,168,.55);background:rgba(46,230,168,.16);color:var(--green)}

  @media (max-width:820px){
    .stage{flex-direction:column;gap:12px}
    .right{width:100%}
    .hero h1{font-size:27px}
    .pcard .sc{font-size:24px}
    .hrow .hd{display:none}
  }
  .hide{display:none !important}
</style>
</head>
<body>
<div id="app">

  <!-- ============ HOME ============ -->
  <section id="scr-home" class="screen active">
    <div class="topbar">
      <div class="brand"><span class="dot"></span><div>DARTS<small>SCORER</small></div></div>
      <div class="spacer"></div>
      <button class="btn sm ghost" id="btnRules">📖 Rules</button>
    </div>
    <div class="hero">
      <h1>Pick your <span>game</span></h1>
      <p>Tap a mode, wrangle the players, throw.</p>
    </div>
    <div class="scroll">
      <div class="grid" id="modeGrid"></div>
    </div>
    <div class="footer-bar">
      <button class="btn primary wide" id="btnToPlayers">Continue &nbsp;→</button>
    </div>
  </section>

  <!-- ============ PLAYERS ============ -->
  <section id="scr-players" class="screen">
    <div class="topbar">
      <button class="btn sm ghost icon-btn" data-back="scr-home">←</button>
      <div><h2 class="title">Players</h2><div class="sub" id="modeLabel">–</div></div>
      <div class="spacer"></div>
      <button class="btn sm" id="btnAddPlayer">+ Add</button>
    </div>
    <div class="scroll">
      <div class="plist" id="playerList"></div>

      <div class="setup-box" id="variantBox">
        <h4>GAME SETTINGS</h4>
        <div class="chip-row" id="variantRow"></div>
      </div>

      <div class="setup-box">
        <h4>OPPONENTS</h4>
        <div class="chip-row" id="oppRow">
          <div class="chip" data-opp="human">👥 Local players</div>
          <div class="chip" data-opp="cpu">🤖 Play vs CPU</div>
        </div>
        <div class="chip-row" style="margin-top:12px" id="cpuRow"></div>
      </div>

      <div class="warn hide" id="warnBox"></div>
    </div>
    <div class="footer-bar">
      <button class="btn primary wide" id="btnStart">Start Game</button>
    </div>
  </section>

  <!-- ============ SCORER ============ -->
  <section id="scr-game" class="screen">
    <div class="topbar" style="padding-bottom:2px">
      <button class="btn sm ghost icon-btn" id="btnQuit">←</button>
      <div style="min-width:0">
        <h2 class="title" style="font-size:19px" id="gTitle">501</h2>
        <div class="sub" id="gSub">–</div>
      </div>
      <div class="spacer"></div>
      <button class="btn sm ghost" id="btnUndo">↶ Undo</button>
      <button class="btn sm ghost icon-btn" id="btnRestart" title="Restart game">⟳</button>
    </div>

    <div class="score-head" id="scoreHead"></div>

    <div class="stage">
      <div class="left">
        <div class="turn-banner">
          <div>
            <div class="who" id="turnWho">–</div>
            <div class="hint" id="turnHint">Throw your darts</div>
          </div>
          <div class="left-count"><b id="turnLeft">–</b><span id="turnLeftLbl">LEFT</span></div>
        </div>
        <div class="slot-row" id="slotRow"></div>
        <div id="modePanel"></div>
      </div>
      <div class="right">
        <div class="pad" id="padBox">
          <div class="pad-display">
            <div class="v" id="padValue">0</div>
            <div class="m" id="padMultLbl">SINGLE</div>
          </div>
          <div class="mult-row" id="multRow">
            <div class="mult on" data-mult="1">S<small>SINGLE</small></div>
            <div class="mult" data-mult="2">D<small>DOUBLE</small></div>
            <div class="mult" data-mult="3">T<small>TREBLE</small></div>
          </div>
          <div class="keys" id="keys"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ MODAL ============ -->
  <div class="overlay" id="overlay">
    <div class="modal" id="modalBody"></div>
  </div>
</div>

<script>
/* =========================================================
   STATE
   ========================================================= */
const PALETTE = ['#ff2d68','#00e0c6','#ffd35c','#8b7bff','#2ee6a8','#ff8a3d','#4da3ff','#ff5ec4'];

const MODES = [
  {
    id:'x01', name:'301 / 501 / 701', ico:'🎯', tag:'CLASSIC',
    desc:'Count down to exactly zero. Finish on a double to win.',
    variants:[{id:'301',label:'301'},{id:'501',label:'501'},{id:'701',label:'701'}],
    def:'501', minPlayers:2, maxPlayers:8,
    rules:'Start from 301/501/701. Each visit is up to 3 darts. Reduce your total; reach exactly 0 on a double (or bullseye) to win. Going below 2, or hitting 0 without a double, is a BUST — your visit score is void and your total resets. A score of 1 left also busts.'
  },
  {id:'cricket', name:'Cricket', ico:'🦗', tag:'TACTIC', desc:'Close 20→15 and bull, then pile on the points.',
   variants:[{id:'cricket',label:'Standard (20→15 + Bull)'},{id:'cricket_noscore',label:'No Score (first to close wins)'}],
   def:'cricket', minPlayers:2, maxPlayers:8,
   rules:'Mark 20, 19, 18, 17, 16, 15 and the bullseye. Three marks closes a number. Once you close a number, further hits score its value — but only if an opponent hasn’t closed it. Win by closing everything with the highest score (or first to close everything in No Score mode).'},
  {id:'rtc', name:'Round the Clock', ico:'🕐', tag:'TRAINING', desc:'Hit 1 through 20 in order, finishing on bull.',
   variants:[{id:'rtc',label:'Any segment (1→20→Bull)'},{id:'rtc_double',label:'Doubles only (hard mode)'}],
   def:'rtc', minPlayers:1, maxPlayers:8,
   rules:'Hit numbers in ascending order: 1, 2, 3 … 20, then the bullseye. Any segment of the target number counts (or doubles only in hard mode). A hit advances you to the next number — misses mean you stay put. First to hit the bull wins.'},
  {id:'atw', name:'Around the World', ico:'🌍', tag:'SPEED', desc:'Sprint 1→20 and bull in the fewest darts.',
   variants:[{id:'atw',label:'Fixed darts (best score)'},{id:'atw_race',label:'Race (first to bull wins)'}],
   def:'atw', minPlayers:1, maxPlayers:8,
   rules:'A pure dart-throwing race: knock off 1 through 20 then the bull in the fewest darts thrown. Fixed-darts mode compares totals at the end; race mode crowns the first player to finish.'},
  {id:'quack', name:'Shanghai', ico:'⚡', tag:'CLUTCH', desc:'1→20, but a single+double+treble of the number wins instantly.',
   variants:[{id:'quack',label:'Shanghai (instant win on S+D+T)'},{id:'kill',label:'Killer'},{id:'baseball',label:'Baseball (9 innings)'}],
   def:'quack', minPlayers:2, maxPlayers:8,
   rules:'Shanghai: work 1→20 in order. Hit single, double AND treble of the same number in one visit and you win immediately — otherwise score accumulates and the highest total after 20 wins. Killer: you become a killer by hitting your double; then hit an opponent’s double to strip a life. Baseball: 9 innings, each worth the runs you score on that number.'},
  {id:'free', name:'Free Practice', ico:'🧘', tag:'SANDBOX', desc:'No rules, no pressure — just track your darts and averages.',
   variants:[{id:'free',label:'Unlimited throws'}],
   def:'free', minPlayers:1, maxPlayers:8,
   rules:'A calm practice board. Every dart is recorded, visit averages and checkout percentages are shown, and there is no losing. Perfect for warming up or testing a new set of flights.'}
];

let state = {
  mode: MODES[0],
  variant: '501',
  players: [],
  opponent: 'human',
  cpuCount: 1,
  g: null
};

/* =========================================================
   UTILITIES
   ========================================================= */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function show(id){
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo({top:0,behavior:'instant'});
}
function vibrate(ms){ if(navigator.vibrate) try{navigator.vibrate(ms)}catch(e){} }

/* =========================================================
   HOME
   ========================================================= */
function renderModes(){
  $('#modeGrid').innerHTML = MODES.map(m => `
    <button class="mode-card ${state.mode.id===m.id?'sel':''}" data-mode="${m.id}">
      <span class="tag">${m.tag}</span>
      <span class="ico">${m.ico}</span>
      <h3>${m.name}</h3>
      <p>${m.desc}</p>
    </button>`).join('');
  $$('#modeGrid .mode-card').forEach(el => el.addEventListener('click', () => {
    state.mode = MODES.find(m => m.id === el.dataset.mode);
    state.variant = state.mode.def;
    renderModes(); vibrate(8);
  }));
}

$('#btnToPlayers').addEventListener('click', () => {
  renderVariants();
  ensurePlayerCount();
  renderPlayers();
  show('scr-players');
  vibrate(10);
});

/* =========================================================
   PLAYERS
   ========================================================= */
const NAMES = ['Player 1','Player 2','Player 3','Player 4','Player 5','Player 6','Player 7','Player 8'];

function ensurePlayerCount(){
  const m = state.mode;
  if(state.players.length === 0){
    const start = Math.max(m.minPlayers, 2);
    for(let i=0;i<start;i++) addPlayer(false);
  }
  while(state.players.length < m.minPlayers) addPlayer(false);
  if(state.players.length > m.maxPlayers) state.players = state.players.slice(0, m.maxPlayers);
  reindexNames();
}
function reindexNames(){
  state.players.forEach((p,i)=>{ if(!p.custom) p.name = NAMES[i] || 'Player '+(i+1); });
}
function addPlayer(rend = true){
  if(state.players.length >= state.mode.maxPlayers) return;
  const i = state.players.length;
  state.players.push({ name: NAMES[i] || 'Player '+(i+1), color: PALETTE[i % PALETTE.length], custom:false, cpu:false });
  if(rend) renderPlayers();
}
$('#btnAddPlayer').addEventListener('click', ()=>{
  if(state.players.length >= state.mode.maxPlayers) return;
  addPlayer(true); vibrate(8);
});

function renderPlayers(){
  const m = state.mode;
  $('#modeLabel').textContent = m.name + ' · ' + (m.variants.find(v=>v.id===state.variant)?.label || '');
  $('#playerList').innerHTML = state.players.map((p,i)=>`
    <div class="prow">
      <div class="avatar" style="background:${p.color}">${(p.name.trim()[0]||'?').toUpperCase()}</div>
      <input class="pname-input" data-i="${i}" value="${p.name.replace(/"/g,'&quot;')}" placeholder="Name" maxlength="16" autocomplete="off">
      ${p.cpu ? '<span style="font-size:11px;font-weight:800;color:var(--accent2);border:1px solid rgba(0,224,198,.4);padding:4px 8px;border-radius:8px">CPU</span>' : ''}
      <button class="del" data-del="${i}">✕</button>
    </div>`).join('');

  $$('#playerList .pname-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = +e.target.dataset.i;
      state.players[i].name = e.target.value;
      state.players[i].custom = e.target.value.trim() !== '';
      const av = e.target.parentElement.querySelector('.avatar');
      av.textContent = (e.target.value.trim()[0] || '?').toUpperCase();
    });
  });
  $$('#playerList .del').forEach(b => b.addEventListener('click', ()=>{
    const i = +b.dataset.del;
    if(state.players.length <= m.minPlayers){ flashWarn(`Need at least ${m.minPlayers} player${m.minPlayers>1?'s':''} for ${m.name}.`); return; }
    state.players.splice(i,1);
    if(state.opponent === 'cpu'){ state.cpuCount = Math.min(state.cpuCount, state.players.length); reapplyCpu(); }
    reindexNames(); renderPlayers(); vibrate(12);
  }));

  $('#btnAddPlayer').disabled = state.players.length >= m.maxPlayers;
  validate();
}

function flashWarn(msg){
  const w = $('#warnBox');
  w.textContent = '⚠️ ' + msg;
  w.classList.remove('hide');
  clearTimeout(flashWarn._t);
  flashWarn._t = setTimeout(()=>w.classList.add('hide'), 2600);
  vibrate(30);
}

function renderVariants(){
  $('#variantBox').classList.remove('hide');
  $('#variantRow').innerHTML = state.mode.variants.map(v =>
    `<div class="chip ${state.variant===v.id?'on':''}" data-v="${v.id}">${v.label}</div>`).join('');
  $$('#variantRow .chip').forEach(c => c.addEventListener('click', ()=>{
    state.variant = c.dataset.v; renderVariants(); renderPlayers(); vibrate(8);
  }));
}

function reapplyCpu(){
  state.players.forEach((p,i)=>{ p.cpu = state.opponent==='cpu' && i >= state.players.length - state.cpuCount; });
}
function renderOpp(){
  $$('#oppRow .chip').forEach(c => c.classList.toggle('on', c.dataset.opp === state.opponent));
  const cr = $('#cpuRow');
  if(state.opponent !== 'cpu'){ cr.innerHTML=''; cr.classList.add('hide'); return; }
  cr.classList.remove('hide');
  const max = Math.max(1, state.players.length-1);
  let html = '';
  for(let n=1;n<=Math.min(max,4);n++) html += `<div class="chip ${state.cpuCount===n?'on':''}" data-cpu="${n}">${n} CPU</div>`;
  cr.innerHTML = html;
  $$('#cpuRow .chip').forEach(c=>c.addEventListener('click',()=>{ state.cpuCount=+c.dataset.cpu; reapplyCpu(); renderOpp(); renderPlayers(); }));
}
$$('#oppRow .chip').forEach(c => c.addEventListener('click', ()=>{
  state.opponent = c.dataset.opp;
  if(state.opponent==='human'){ state.cpuCount=0; state.players.forEach(p=>p.cpu=false); }
  else { state.cpuCount = 1; reapplyCpu(); }
  renderOpp(); renderPlayers(); vibrate(8);
}));

function validate(){
  const m = state.mode, n = state.players.length;
  let msg = '';
  if(n < m.minPlayers) msg = `Add at least ${m.minPlayers} player${m.minPlayers>1?'s':''}.`;
  if(state.opponent==='cpu' && state.cpuCount >= n) msg = 'Keep at least one human player.';
  $('#btnStart').disabled = !!msg;
  $('#warnBox').classList.toggle('hide', !msg);
  if(msg) $('#warnBox').textContent = '⚠️ ' + msg;
}

$('#btnStart').addEventListener('click', () => { startGame(); });

$('#btnRules').addEventListener('click', ()=>{
  openModal(`
    <div class="trophy">📖</div>
    <h2>How to play</h2>
    <div style="text-align:left;margin-top:16px">
      ${MODES.map(m=>`<div style="margin-bottom:16px"><div style="font-weight:900;font-size:15px">${m.ico} ${m.name}</div>
      <div style="color:var(--muted);font-size:13px;font-weight:600;line-height:1.55;margin-top:5px">${m.rules}</div></div>`).join('')}
      <div style="border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12px;font-weight:600">
        Keypad: choose S / D / T then the number. Extra buttons: <b>25</b> = outer bull, <b>BULL</b> = 50 (double bull), <b>0</b> = miss, <b>⌫</b> = delete last dart.
      </div>
    </div>
    <div class="row"><button class="btn primary" data-close>Got it</button></div>`);
});

$$('[data-back]').forEach(b => b.addEventListener('click', ()=>{ show(b.dataset.back); vibrate(8); }));

/* =========================================================
   GAME SETUP
   ========================================================= */
function startGame(){
  const players = state.players.map((p,i)=>({
    id:i, name:(p.name.trim()||('Player '+(i+1))), color:p.color, cpu:p.cpu
  }));
  const g = {
    mode: state.mode.id, variant: state.variant, players, turn: 0,
    dartsThrown: {}, history: [], aiPending: false, over:false, _visit:{}
  };
  players.forEach(p => g.dartsThrown[p.id] = 0);

  if(g.mode==='x01'){
    const start = +g.variant.replace('x','') || 501;
    g.startValue = start;
    players.forEach(p=>{ p.score = start; });
  }
  if(g.mode==='cricket') players.forEach(p=>{ p.marks = {20:0,19:0,18:0,17:0,16:0,15:0,25:0}; p.score = 0; });
  if(g.mode==='rtc' || g.mode==='atw') players.forEach(p=>{ p.target = 1; p.hits = 0; });
  if(g.mode==='quack'){
    if(g.variant==='quack') players.forEach(p=>{ p.target = 1; p.score = 0; });
    if(g.variant==='kill') players.forEach(p=>{ p.lives = 3; p.killer = false; p.targetAssigned = false; });
    if(g.variant==='baseball') players.forEach(p=>{ p.score = 0; p.inning = 1; p.runs = 0; });
  }
  if(g.mode==='free') players.forEach(p=>{ p.score = 0; });

  state.g = g;
  show('scr-game');
  buildKeypad();
  renderGame();
  vibrate(20);
  maybeCpuTurn();
}

/* =========================================================
   KEYPAD
   ========================================================= */
let pad = { value:0, mult:1 };

function buildKeypad(){
  let html = '';
  for(let n=1;n<=20;n++) html += `<button class="key" data-num="${n}">${n}</button>`;
  html += `<button class="key bull" data-num="25">25</button>`;
  html += `<button class="key bull" data-num="50">BULL</button>`;
  html += `<button class="key zero" data-num="0">MISS</button>`;
  html += `<button class="key back" data-back>⌫ DELETE LAST DART</button>`;
  html += `<button class="key enter" data-enter>ENTER DART</button>`;
  $('#keys').innerHTML = html;

  $$('#keys .key[data-num]').forEach(k => k.addEventListener('click', ()=>{
    pad.value = +k.dataset.num;
    if(pad.value>=25) pad.mult = 1;
    renderPad(); vibrate(6);
  }));
  $$('#multRow .mult').forEach(m => m.addEventListener('click', ()=>{
    pad.mult = +m.dataset.mult; renderPad(); vibrate(6);
  }));
  $('#keys [data-back]').addEventListener('click', ()=>{
    const g = state.g; if(!g) return;
    const cur = g.players[g.turn];
    if((g._visit[cur.id]||[]).length){
      g._visit[cur.id].pop();
      g.dartsThrown[cur.id] = Math.max(0,(g.dartsThrown[cur.id]||1)-1);
      rebuildAll(); renderGame();
    }
    vibrate(10);
  });
  $('#keys [data-enter]').addEventListener('click', enterDart);
}

function renderPad(){
  $('#padValue').textContent = pad.value || 0;
  $('#padMultLbl').textContent = pad.value===0 ? 'MISS' : (pad.value===25 ? 'OUTER BULL' : pad.value===50 ? 'DOUBLE BULL' : pad.mult===1?'SINGLE':pad.mult===2?'DOUBLE':'TREBLE');
  $$('#multRow .mult').forEach(m => m.classList.toggle('on', +m.dataset.mult===pad.mult));
  $$('#keys .key[data-num]').forEach(k => {
    const on = +k.dataset.num === pad.value;
    k.style.outline = on ? '2px solid var(--accent2)' : 'none';
    k.style.outlineOffset = '-2px';
  });
}
function dartScore(v, mult){
  if(v===0) return 0;
  if(v===50) return 50;
  return v*mult;
}
function dartName(v, mult){
  if(v===0) return 'Miss';
  if(v===25) return 'Outer Bull (25)';
  if(v===50) return 'Bullseye (50)';
  return (mult===1?'':mult===2?'Double ':'Treble ') + v;
}
function dartLabel(v,mult){
  if(v===0) return '–';
  if(v===25) return 'OB';
  if(v===50) return 'BULL';
  return (mult===1?'S':mult===2?'D':'T') + v;
}

/* =========================================================
   ENTER DART
   ========================================================= */
function enterDart(){
  const g = state.g;
  if(!g || g.over) return;
  const p = g.players[g.turn];
  if(p.cpu || g.aiPending) return;
  if((g._visit[p.id]||[]).length >= 3) return;

  const v = pad.value, m = v>=25 ? 1 : pad.mult;
  g.dartsThrown[p.id] = (g.dartsThrown[p.id]||0)+1;
  if(!g._visit[p.id]) g._visit[p.id] = [];
  g._visit[p.id].push({ v, mult:m, score: dartScore(v,m) });

  applyDart(p, v, m);
  pad.value = 0; pad.mult = 1; renderPad();
  renderGame();
  vibrate(12);

  if(g.over) return;
  if((g._visit[p.id]||[]).length >= 3) endVisit();
}

function applyDart(p, v, m){
  const g = state.g;
  if(g.mode==='rtc'){
    if(v===0) return;
    const t = p.target;
    if(t<=20){ const local = state.variant==='rtc_double'; if(local ? (m===2 && v===t) : (v===t)){ p.target++; p.hits++; } }
    else if(v===25 || v===50){ p.target++; p.hits++; }
  }
  else if(g.mode==='atw'){
    if(v===0) return;
    const t = p.target;
    if(t<=20){ if(v===t){ p.target++; p.hits++; } }
    else if(v===25 || v===50){ p.target++; p.hits++; }
  }
  else if(g.mode==='quack'){
    if(g.variant==='quack'){
      const t = p.target;
      if(t<=20 && v===t){
        if(!p._visitNums) p._visitNums = [];
        p._visitNums.push(m);
        if(p._visitNums.includes(1) && p._visitNums.includes(2) && p._visitNums.includes(3)){
          g.over = true; g.winner = p; g.winReason = 'SHANGHAI! Single + Double + Treble of ' + t;
        }
        p.score += dartScore(v,m);
      } else if(v!==0){ p.score += dartScore(v,m); }
    }
    else if(g.variant==='kill'){
      if(!p.targetAssigned){ if(m===2){ p.killer = true; p.killerNum = v; p.targetAssigned = true; } }
      else if(p.killer && m===2){
        const victim = g.players.find(o=>o!==p && o.killerNum===v && o.lives>0);
        if(victim) victim.lives--;
      }
    }
    else if(g.variant==='baseball'){
      if(v===p.inning) p.runs += dartScore(v,m);
    }
  }
  else if(g.mode==='free'){ p.score += dartScore(v,m); }
  // x01 and cricket are settled at visit close / recompute
}

function rebuildAll(){
  const g = state.g;
  if(g.mode==='x01') g.players.forEach(p=>p.score=g.startValue);
  if(g.mode==='cricket'){ g.players.forEach(p=>p.marks={20:0,19:0,18:0,17:0,16:0,15:0,25:0}); g.players.forEach(p=>p.score=0); }
  if(g.mode==='rtc') g.players.forEach(p=>{p.target=1;p.hits=0;});
  if(g.mode==='atw') g.players.forEach(p=>{p.target=1;p.hits=0;});
  if(g.mode==='quack'){
    if(g.variant==='quack') g.players.forEach(p=>{p.target=1;p.score=0;p._visitNums=[];});
    if(g.variant==='kill') g.players.forEach(p=>{p.lives=3;p.killer=false;p.targetAssigned=false;});
    if(g.variant==='baseball') g.players.forEach(p=>{p.score=0;p.runs=0;p.inning=1;});
  }
  if(g.mode==='free') g.players.forEach(p=>p.score=0);
  g.over=false; g.winner=null; g.winReason=null;

  // replay completed x01 visits
  if(g.mode==='x01'){
    g.history.forEach(h=>{
      const p = g.players.find(x=>x.id===h.player); if(!p) return;
      if(!h.bust) p.score -= h.total;
    });
  }
  // replay non-x01 history + cricket score
  const allDarts = [];
  g.history.forEach(h=>h.darts.forEach(d=>allDarts.push({pid:h.player,d})));
  if(g.mode==='cricket'){
    const keys=[20,19,18,17,16,15,25];
    const marks = {}; g.players.forEach(p=>marks[p.id]={20:0,19:0,18:0,17:0,16:0,15:0,25:0});
    const oppOpen=(key,pid)=>g.players.some(o=>o.id!==pid && (marks[o.id][key]||0)<3);
    allDarts.forEach(({pid,d})=>{
      const p=g.players.find(x=>x.id===pid); if(!p) return;
      const key = d.v>=25?25:d.v; if(!keys.includes(key)) return;
      const add = d.v===50?2:d.mult;
      const before = marks[pid][key]; const after = Math.min(3,before+add);
      marks[pid][key]=after;
      if(before>=3 || after>3){ const overflow = before>=3?add:after-3; if(state.variant!=='cricket_noscore' && oppOpen(key,pid)) p.score += key*overflow; }
    });
    g.players.forEach(p=>p.marks = marks[p.id]);
  } else if(g.mode!=='x01'){
    allDarts.forEach(({pid,d})=>{
      const p=g.players.find(x=>x.id===pid); if(!p) return;
      applyDart(p, d.v, d.mult);
    });
  }
  // partial visits
  Object.keys(g._visit||{}).forEach(k=>{
    const p = g.players.find(x=>x.id===+k); if(!p) return;
    (g._visit[k]||[]).forEach(d=>{
      if(g.mode==='cricket'){
        const key=d.v>=25?25:d.v;
        if(p.marks && p.marks[key]!==undefined){ p.marks[key]=Math.min(3,p.marks[key]+(d.v===50?2:d.mult)); }
      } else if(g.mode!=='x01'){
        applyDart(p, d.v, d.mult);
      }
    });
  });
}

/* =========================================================
   END VISIT
   ========================================================= */
function endVisit(){
  const g = state.g;
  const p = g.players[g.turn];
  const darts = [...(g._visit[p.id] || [])];
  const total = darts.reduce((a,d)=>a+d.score,0);
  const entry = { player:p.id, darts, total, bust:false, checkout:false };

  if(g.mode==='x01'){
    const remaining = p.score - total;
    const last = darts[darts.length-1];
    const lastIsDouble = last && (last.mult===2 || last.v===50);
    let checkout=false, bust=false;
    if(remaining === 0){ if(lastIsDouble) checkout=true; else bust=true; }
    else if(remaining < 0 || remaining === 1) bust = true;
    if(bust) entry.bust = true;
    else {
      p.score = remaining;
      if(checkout){
        entry.checkout = true; g.over = true; g.winner = p;
        g.winReason = `${g.startValue} checked out in ${countDartsUsed(p.id)+darts.length} darts`;
      }
    }
  }
  else if(g.mode==='cricket'){
    if(state.variant!=='cricket_noscore') computeCricketScores();
    const allClosed = x => Object.keys(x.marks).every(k=>x.marks[k]>=3);
    if(g.players.some(allClosed)){
      const closers = g.players.filter(allClosed);
      closers.sort((a,b)=>b.score-a.score);
      g.over = true; g.winner = closers[0];
      g.winReason = state.variant==='cricket_noscore' ? 'First to close every number' : 'Closed every number with ' + closers[0].score + ' points';
    }
  }
  else if(g.mode==='rtc'){
    const finishers = g.players.filter(x=>x.target>20 && !x.done);
    finishers.forEach(x=>{ x.done = true; x.finishOrder = g.players.filter(y=>y.done).length; });
    if(finishers.length){
      const first = [...finishers].sort((a,b)=>a.finishOrder-b.finishOrder)[0];
      g.over = true; g.winner = first;
      g.winReason = g.players.length===1 ? 'Completed the full clock' : 'First to hit 1→20 then the bullseye!';
    }
  }
  else if(g.mode==='atw'){
    const finishers = g.players.filter(x=>x.target>20 && !x.done);
    if(finishers.length){
      finishers[0].done = true;
      g.over = true; g.winner = finishers[0];
      g.winReason = (state.variant==='atw_race' ? 'First to the bull — ' : 'Finished the world in ') + countDartsUsed(finishers[0].id) + ' darts';
    }
  }
  else if(g.mode==='quack'){
    if(g.variant==='quack'){
      const done = g.players.filter(x=>x.target>20);
      if(done.length){
        const best = [...g.players].sort((a,b)=>b.score-a.score)[0];
        g.over = true; g.winner = best; g.winReason = 'Highest Shanghai total: ' + best.score;
      }
    }
    if(g.variant==='kill'){
      const alive = g.players.filter(x=>x.lives>0);
      const killers = alive.filter(x=>x.killer);
      if(alive.length===1 && g.players.length>1){ g.over=true; g.winner=alive[0]; g.winReason='Last one standing'; }
      else if(killers.length===1 && g.players.every(x=>x===killers[0] || x.lives<=0)){ g.over=true; g.winner=killers[0]; g.winReason='Last killer standing'; }
    }
    if(g.variant==='baseball'){
      g.players.forEach(pl=>{ if(pl.inning===9) pl.done=true; else pl.inning++; });
      if(g.players.every(pl=>pl.done || pl.inning>=10)){
        const best=[...g.players].sort((a,b)=>b.runs-a.runs)[0];
        g.over=true; g.winner=best; g.winReason='Most runs after 9 innings: '+best.runs;
      }
    }
  }

  g.history.push(entry);
  g._visit[p.id] = [];
  g.dartsThrown[p.id] = 0;
  if(g.mode==='quack') p._visitNums = [];

  if(g.over){ renderGame(); setTimeout(announceWin, 320); return; }
  advanceTurn();
  renderGame();
  maybeCpuTurn();
}

function countDartsUsed(pid){
  return state.g.history.filter(h=>h.player===pid).reduce((a,h)=>a+h.darts.length,0);
}

function computeCricketScores(){
  const g = state.g;
  if(state.variant==='cricket_noscore'){ g.players.forEach(p=>p.score=0); return; }
  const keys=[20,19,18,17,16,15,25];
  const marks={}; g.players.forEach(p=>marks[p.id]={20:0,19:0,18:0,17:0,16:0,15:0,25:0});
  g.players.forEach(p=>p.score=0);
  const oppOpen=(key,pid)=>g.players.some(o=>o.id!==pid && (marks[o.id][key]||0)<3);
  const allDarts=[];
  g.history.forEach(h=>h.darts.forEach(d=>allDarts.push({pid:h.player,d})));
  Object.keys(g._visit||{}).forEach(k=>(g._visit[k]||[]).forEach(d=>allDarts.push({pid:+k,d})));
  allDarts.forEach(({pid,d})=>{
    const p=g.players.find(x=>x.id===pid); if(!p) return;
    const key=d.v>=25?25:d.v; if(!keys.includes(key)) return;
    const add=d.v===50?2:d.mult;
    const before=marks[pid][key]; const after=Math.min(3,before+add);
    marks[pid][key]=after;
    if(before>=3 || after>3){ const overflow=before>=3?add:after-3; if(oppOpen(key,pid)) p.score += key*overflow; }
  });
  g.players.forEach(p=>p.marks=marks[p.id]);
}

function advanceTurn(){
  const g = state.g;
  const n = g.players.length;
  for(let i=1;i<=n;i++){
    const idx = (g.turn+i)%n;
    const p = g.players[idx];
    const elim = (g.mode==='quack' && g.variant==='kill' && p.lives<=0);
    if(!elim){ g.turn = idx; return; }
  }
}

/* =========================================================
   CPU
   ========================================================= */
function maybeCpuTurn(){
  const g = state.g;
  if(!g || g.over) return;
  const p = g.players[g.turn];
  if(!p.cpu){ g.aiPending=false; return; }
  g.aiPending = true;
  setTimeout(()=>cpuThrow(p), 620);
}
function cpuThrow(p){
  const g = state.g;
  if(g.over || !p.cpu){ g.aiPending=false; return; }
  if((g._visit[p.id]||[]).length >= 3){ endVisit(); return; }

  const dart = chooseCpuDart(p);
  g.dartsThrown[p.id] = (g.dartsThrown[p.id]||0)+1;
  if(!g._visit[p.id]) g._visit[p.id]=[];
  g._visit[p.id].push({...dart, score:dartScore(dart.v,dart.mult)});
  applyDart(p, dart.v, dart.mult);

  pad.value=0; pad.mult=1; renderPad();
  renderGame();
  if(g.over) return;
  if((g._visit[p.id]||[]).length >= 3) endVisit();
  else setTimeout(()=>cpuThrow(p), 560);
}
function chooseCpuDart(p){
  const g = state.g;
  const rnd = () => Math.random();
  if(g.mode==='x01'){
    const used = (g._visit[p.id]||[]).reduce((a,d)=>a+d.score,0);
    const rem = p.score - used;
    if(rem <= 170 && rem >= 2){
      const path = findCheckout(rem);
      if(path && path.length){ const d = path[path.length-1]; return {v:d.v, mult:d.mult}; }
    }
    const target = (rem-40);
    const aim = [60,57,54,51,50,45,40,36,32,20,19,18];
    const best = aim.reduce((a,b)=> Math.abs(b-target)<Math.abs(a-target)?b:a, aim[0]);
    const v = Math.min(20,Math.max(1,Math.round(best/3)));
    return {v, mult:3};
  }
  if(g.mode==='cricket'){
    const keys=[20,19,18,17,16,15,25];
    const need = keys.find(k=>(p.marks[k]||0)<3);
    if(need){
      if(need===25) return rnd()<.85? {v:25,mult:1}:{v:0,mult:1};
      const mr=rnd(); return {v:need, mult: mr<.6?1:mr<.9?2:3};
    }
    const open = keys.filter(k=>g.players.some(o=>o!==p && (o.marks[k]||0)<3));
    const k = open[0]||20;
    return {v:k===25?25:k, mult: k===25?1:3};
  }
  if(g.mode==='rtc' || g.mode==='atw'){
    const t = p.target;
    if(t>20) return rnd()<.5? {v:25,mult:1}:{v:50,mult:1};
    if(state.variant==='rtc_double' && g.mode==='rtc') return {v:t, mult: rnd()<.5?2:1};
    return {v:t, mult: rnd()<.7?1:2};
  }
  if(g.mode==='quack'){
    if(g.variant==='quack'){ const t=Math.min(20,p.target); return {v:t, mult:rnd()<.5?1:rnd()<.85?2:3}; }
    if(g.variant==='kill') return {v:1+Math.floor(rnd()*20), mult:rnd()<.5?2:1};
    if(g.variant==='baseball'){ const t=Math.min(9,Math.max(1,p.inning)); return {v:t, mult:rnd()<.6?1:rnd()<.9?2:3}; }
  }
  const r=rnd();
  if(r<.10) return {v:0,mult:1};
  const mr=rnd();
  return {v:1+Math.floor(rnd()*20), mult: mr<.62?1:mr<.87?2:3};
}
function findCheckout(score){
  if(score>170 || score<2) return null;
  const doubles=[];
  for(let d=1;d<=20;d++) doubles.push({v:d,mult:2,score:d*2});
  doubles.push({v:50,mult:1,score:50});
  if(score<=40){ const d = doubles.find(x=>x.score===score); return d?[d]:null; }
  for(let n=20;n>=1;n--){
    const t={v:n,mult:3,score:n*3}, rest=score-t.score;
    if(rest>=2 && rest<=40){ const d=doubles.find(x=>x.score===rest); if(d) return [t,d]; }
  }
  for(let n=20;n>=1;n--){
    const s={v:n,mult:1,score:n}, rest=score-s.score;
    if(rest>=2 && rest<=40){ const d=doubles.find(x=>x.score===rest); if(d) return [s,d]; }
  }
  return null;
}

/* =========================================================
   RENDER GAME
   ========================================================= */
function renderGame(){
  const g = state.g;
  if(!g) return;
  const p = g.players[g.turn];

  $('#gTitle').textContent = titleFor(g);
  $('#gSub').textContent = subtitleFor(g);

  $('#scoreHead').innerHTML = g.players.map(pl => {
    const thrown = g.dartsThrown[pl.id]||0;
    const isTurn = pl.id===g.turn && !g.over;
    return `<div class="pcard ${isTurn?'turn':''}">
      <div class="nm" style="color:${isTurn?'#fff':pl.color}">${escapeHtml(pl.name)}${pl.cpu?' 🤖':''}</div>
      <div class="sc">${bigScore(pl)}</div>
      <div class="meta">${metaScore(pl)}</div>
      <div class="darts">${[0,1,2].map(i=>`<i class="${i<thrown?'on':''}"></i>`).join('')}</div>
    </div>`;
  }).join('');

  $('#turnWho').textContent = g.over ? 'Game over' : `${p.name}${p.cpu?' (CPU)':''} to throw`;
  $('#turnHint').textContent = hintFor(g, p);
  $('#turnLeft').textContent = (g.dartsThrown[p.id]||0)+'/3';
  $('#turnLeftLbl').textContent = 'DARTS';

  const visit = g._visit[p.id] || [];
  $('#slotRow').innerHTML = [0,1,2].map(i=>{
    const d = visit[i];
    return `<div class="slot ${d?'filled':''}">
      <div class="big">${d?dartLabel(d.v,d.mult):'—'}</div>
      <div class="lbl">${d?d.score+' PTS':'DART '+(i+1)}</div>
    </div>`;
  }).join('');

  renderModePanel(g, p);

  const blocked = g.over || p.cpu || g.aiPending;
  $('#padBox').style.opacity = blocked ? '.42' : '1';
  $('#padBox').style.pointerEvents = blocked ? 'none' : 'auto';
  renderPad();
}

function titleFor(g){
  if(g.mode==='x01') return g.startValue + ' Double Out';
  const m = MODES.find(x=>x.id===g.mode);
  const v = m.variants.find(x=>x.id===g.variant);
  return v ? v.label.split('(')[0].trim() : m.name;
}
function subtitleFor(g){
  return MODES.find(x=>x.id===g.mode).name + ' · ' + g.players.length + ' players';
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function bigScore(p){
  const g=state.g;
  if(g.mode==='x01'||g.mode==='cricket') return p.score;
  if(g.mode==='rtc'||g.mode==='atw') return p.target>20 ? '✓' : p.target;
  if(g.mode==='quack'){
    if(g.variant==='quack') return p.score;
    if(g.variant==='kill') return p.lives>0? '❤'.repeat(p.lives) : '✖';
    if(g.variant==='baseball') return (p.runs||0);
  }
  if(g.mode==='free') return p.score;
  return '';
}
function metaScore(p){
  const g=state.g;
  if(g.mode==='x01') return countDartsUsed(p.id)+' darts thrown';
  if(g.mode==='cricket'){ const closed=Object.keys(p.marks).filter(k=>p.marks[k]>=3).length; return closed+'/7 closed'; }
  if(g.mode==='rtc'||g.mode==='atw') return p.hits+' hits · '+countDartsUsed(p.id)+' darts';
  if(g.mode==='quack'){
    if(g.variant==='baseball') return 'inning '+Math.min(9,p.inning);
    if(g.variant==='kill') return p.killer? ('KILLER '+p.killerNum) : 'not a killer yet';
    return 'target '+(p.target>20?'done':p.target);
  }
  if(g.mode==='free'){ const d=countDartsUsed(p.id); return d? (p.score/d*3).toFixed(1)+' avg/3 darts' : 'no darts yet'; }
  return '';
}
function hintFor(g,p){
  if(g.over) return g.winReason || '';
  if(p.cpu) return 'CPU is throwing…';
  const th = g.dartsThrown[p.id]||0;
  if(g.mode==='x01'){
    const left = p.score;
    if(left<=170){ const out=findCheckout(left); if(out) return 'Checkout: ' + out.map(d=>dartName(d.v,d.mult)).join(' → '); }
    return th===0 ? 'Up to 3 darts this visit' : (3-th)+' dart'+((3-th)>1?'s':'')+' left this visit';
  }
  if(g.mode==='cricket') return 'Close 20→15 and the bull, then score';
  if(g.mode==='rtc') return 'Aim for '+(p.target>20?'the BULLSEYE':p.target+(state.variant==='rtc_double'?' (double only)':''));
  if(g.mode==='atw') return 'Aim for '+(p.target>20?'the BULLSEYE':p.target);
  if(g.mode==='quack'){
    if(g.variant==='quack') return 'Aim for '+p.target+' — S+D+T wins instantly!';
    if(g.variant==='kill') return p.killer? 'Hit an opponent’s double to strip a life' : 'Hit any double to become a killer';
    if(g.variant==='baseball') return 'Inning '+Math.min(9,p.inning)+' — runs on '+Math.min(9,p.inning);
  }
  return 'Throw your darts';
}

function renderModePanel(g,p){
  const box = $('#modePanel');
  if(g.mode==='rtc'){
    box.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:10px;letter-spacing:1.8px;color:var(--muted);font-weight:800">CLOCK · ${escapeHtml(p.name)}</div>
      <div class="rtc-grid" id="rtcGrid"></div></div>`;
    const grid = $('#rtcGrid');
    for(let n=1;n<=20;n++){
      const cls = n < p.target ? 'done' : (n===p.target ? 'next' : '');
      grid.insertAdjacentHTML('beforeend', `<div class="rtc-cell ${cls}">${n}</div>`);
    }
    grid.insertAdjacentHTML('beforeend', `<div class="rtc-cell ${p.target>20?'done':''}">🎯</div>`);
    return;
  }
  if(g.mode==='cricket'){
    const keys=[20,19,18,17,16,15,25];
    box.innerHTML = `<div class="cricket-panel">
      <div style="font-size:10px;letter-spacing:1.8px;color:var(--muted);font-weight:800">CRICKET BOARD</div>
      ${keys.map(k=>`
        <div class="cr-row">
          <div class="cr-num">${k===25?'BULL':k}</div>
          <div class="cr-marks">
            ${g.players.map(pl=>{
              const m=pl.marks[k]||0;
              const cls = m>=3?'closed':(m>0?'hit':'');
              return `<div class="mchip ${cls}"><span style="color:${pl.color}">${escapeHtml(pl.name).slice(0,7)}</span><b>${m>=3?'✓':m===0?'–':'/'.repeat(m)}</b>${m>3?'<b style="color:var(--gold)">+'+((m-3)*k)+'</b>':''}</div>`;
            }).join('')}
          </div>
        </div>`).join('')}
    </div>`;
    return;
  }
  box.innerHTML = `<div class="hist">
    <div class="hh">VISIT LOG</div>
    ${histRows(g)}
  </div>`;
  const el = box.querySelector('.hist');
  if(el) el.scrollTop = 0;
}
function histRows(g){
  const rows = [...g.history].slice(-40).reverse();
  if(!rows.length) return `<div style="padding:14px 8px;color:var(--muted);font-size:12.5px;font-weight:600">No throws yet — get started!</div>`;
  return rows.map(h=>{
    const p = g.players.find(x=>x.id===h.player);
    const ds = h.darts.map(d=>dartLabel(d.v,d.mult)).join(' ');
    return `<div class="hrow">
      <div class="hn" style="color:${p.color}">${escapeHtml(p.name)}</div>
      <div class="hd">${ds || '–'}</div>
      <div class="hv ${h.bust?'bust':''}">${h.bust?'BUST':h.total}</div>
    </div>`;
  }).join('');
}

/* =========================================================
   MODAL / RESTART / UNDO
   ========================================================= */
function openModal(html){
  $('#modalBody').innerHTML = html;
  $('#overlay').classList.add('show');
  $('#modalBody').querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
}
function closeModal(){ $('#overlay').classList.remove('show'); }

function announceWin(){
  const g = state.g;
  if(!g.winner) return;
  vibrate([40,60,40,60,120]);
  openModal(`
    <div class="trophy">🏆</div>
    <h2>${escapeHtml(g.winner.name)} wins!</h2>
    <div class="win">${escapeHtml(g.winReason||'')}</div>
    <p>${statsLine(g)}</p>
    <div class="row">
      <button class="btn" data-again>Rematch</button>
      <button class="btn primary" data-close>Done</button>
    </div>`);
  const again = $('#modalBody [data-again]');
  if(again) again.addEventListener('click', ()=>{ closeModal(); startGame(); });
}
function statsLine(g){
  return g.players.map(p=>{
    const d = countDartsUsed(p.id);
    const visits = g.history.filter(h=>h.player===p.id).length || 1;
    const scored = g.history.filter(h=>h.player===p.id && !h.bust).reduce((a,h)=>a+h.total,0);
    return `${escapeHtml(p.name)}: ${d} darts, avg ${(scored/visits).toFixed(1)}/visit`;
  }).join('<br>');
}

$('#btnRestart').addEventListener('click', ()=>{
  openModal(`<div class="trophy">⟳</div><h2>Restart?</h2>
    <p>Current scores will be wiped and the game will begin again.</p>
    <div class="row"><button class="btn" data-close>Cancel</button>
    <button class="btn primary" data-yes>Restart</button></div>`);
  $('#modalBody [data-yes]').addEventListener('click', ()=>{ closeModal(); startGame(); });
});
$('#btnQuit').addEventListener('click', ()=>{
  openModal(`<div class="trophy">🚪</div><h2>Leave game?</h2>
    <p>Your scores won’t be saved — but the players and mode will be.</p>
    <div class="row"><button class="btn" data-close>Stay</button>
    <button class="btn primary" data-yes>Leave</button></div>`);
  $('#modalBody [data-yes]').addEventListener('click', ()=>{
    closeModal(); state.g=null; renderPlayers(); renderOpp(); show('scr-players');
  });
});
$('#btnUndo').addEventListener('click', ()=>{
  const g = state.g; if(!g) return;
  const p = g.players[g.turn];
  if((g._visit[p.id]||[]).length){
    g._visit[p.id].pop();
    g.dartsThrown[p.id] = Math.max(0,(g.dartsThrown[p.id]||1)-1);
    rebuildAll(); renderGame(); vibrate(10); return;
  }
  const last = g.history.pop();
  if(!last){ flashWarn('Nothing left to undo.'); return; }
  g.turn = g.players.findIndex(x=>x.id===last.player);
  g._visit[last.player] = last.darts.map(d=>({...d}));
  g.dartsThrown[last.player] = last.darts.length;
  rebuildAll(); renderGame(); vibrate(10);
});

/* =========================================================
   INIT
   ========================================================= */
renderModes();
renderPad();
document.addEventListener('dblclick', e=>e.preventDefault(), {passive:false});
document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
</script>
